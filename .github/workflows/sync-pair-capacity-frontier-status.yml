name: sync pair-capacity frontier status

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/sync_pair_capacity_frontier_status.py'
      - '.github/workflows/sync-pair-capacity-frontier-status.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reviewer and restart surfaces
        run: python3 tools/sync_pair_capacity_frontier_status.py
      - name: Commit synchronized status
        run: |
          if git diff --quiet -- README.md CURRENT_STATE.md project/research/general_n/2026-09-13-alternative-attacks-v1/README.md; then
            echo 'Status surfaces already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CURRENT_STATE.md project/research/general_n/2026-09-13-alternative-attacks-v1/README.md
          git commit -m 'Sync pair-capacity frontier status'
          git push
