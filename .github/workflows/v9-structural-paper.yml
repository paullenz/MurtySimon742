name: Build and check v9 general structural paper
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v9-structural-paper.yml'
      - 'project/research/general_n/2026-09-07-stability-spare-sources-v9/PUBLICATION_CAPSULE*.b64'
      - 'project/research/general_n/2026-09-07-stability-spare-sources-v9/PUBLICATION_CAPSULE.json'
      - 'project/research/general_n/2026-09-07-stability-spare-sources-v9/restore_checkpoint.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v9-structural-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Preserve ordinary archive blobs in the temporary checkout
        run: |
          git config --local filter.lfs.process ''
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.required false
          git update-index --refresh
          git diff --exit-code
      - name: Recover exact authored sources
        run: python3 -I -B project/research/general_n/2026-09-07-stability-spare-sources-v9/restore_checkpoint.py
      - name: Install paper-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Build paper and run complete new regression checks
        run: |
          set -euo pipefail
          D=project/research/general_n/2026-09-07-stability-spare-sources-v9
          python3 -I -B "$D/build_paper.py"
          python3 -I -B "$D/replay.py" --output "$RUNNER_TEMP/v9-regression"
          cp "$RUNNER_TEMP/v9-regression/FULL_REPLAY_REPORT.json" "$D/evidence/REMOTE_REPLAY_REPORT.json"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('project/research/general_n/2026-09-07-stability-spare-sources-v9')
          p=root/'MANIFEST.json'
          m=json.loads(p.read_text())
          files={}
          for f in sorted(root.rglob('*')):
              if not f.is_file() or f.name in ('MANIFEST.json','PUBLICATION_RECEIPT.json') or '__pycache__' in f.parts:
                  continue
              b=f.read_bytes()
              files[f.relative_to(root).as_posix()]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          m['files']=files
          p.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
          python3 -I -B "$D/replay.py" --verify-only
      - name: Preserve the published checkpoint for read-back
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-general-structural-checkpoint
          path: project/research/general_n/2026-09-07-stability-spare-sources-v9/
          if-no-files-found: error
          retention-days: 7
      - name: Commit only the new checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- project/research/general_n/2026-09-07-stability-spare-sources-v9
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish checked v9 charging stability and spare-source manuscript with full evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
