name: General RX-Hall n29 t2 BC function hard38 preservation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-bc-function-hard38.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Scan and preserve hard-core surfaces
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          B="$R/checkpoints/N29_BOUNDARY_SPECIALISATION_RUN_34364666552.json"
          mkdir -p out
          for MODE in demand45 hard38; do
            for CONE in supermodular monotone; do
              for SH in none full; do
                .venv/bin/python -I -B "$R/n29_t2_bc_function_cone_scan.py" \
                  --mode "$MODE" --cone "$CONE" --sh-mode "$SH" \
                  --dictionary-json "$R/N29_CANONICAL_DICTIONARY.json" \
                  --boundary-json "$B" --output "out/${MODE}_${CONE}_${SH}.json"
              done
            done
          done
          python3 - <<'PY' > out/FULL.json
          import glob,json
          R={}
          for p in sorted(glob.glob('out/*.json')):
              if p.endswith('FULL.json'): continue
              R[p.split('/')[-1]]=json.load(open(p))
          print(json.dumps({'schema':'n29-t2-bc-function-hard38-preservation-v1','floating_point_reconnaissance_only':True,'results':R},indent=2,sort_keys=True))
          PY
          python3 - <<'PY'
          import json
          j=json.load(open('out/FULL.json'))
          for k,v in j['results'].items():
              s=v.get('surface',{})
              print(k, 'success=',v['success'],'objective=',v.get('objective'),'negmixed=',s.get('negative_mixed_count'),'levels=',s.get('distinct_positive_levels'),'activeSH=',v.get('active_SH_count'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-t2-bc-function-hard38
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit full durable result
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_T2_BC_FUNCTION_HARD38_RUN_${GITHUB_RUN_ID}.json"
          cp out/FULL.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 t2 BC function hard38 scan ${GITHUB_RUN_ID}"
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            sleep $((attempt*2))
          done
          exit 1
