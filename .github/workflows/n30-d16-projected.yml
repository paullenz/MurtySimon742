name: N30 Delta16 pair-threshold projection

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/n30/2026-09-08-minimal-kernel-recon-v1/n30_projected.py'
      - '.github/workflows/n30-d16-projected.yml'

permissions:
  contents: read
  actions: read

jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        m: [225,226]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: n30-d16-m${{ matrix.m }}-rows
          path: rows
          github-token: ${{ github.token }}
          run-id: 34286806474
      - name: Apply audited projection
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-08-minimal-kernel-recon-v1
          python3 -I -B "$D/n30_projected.py" \
            --demands rows/demands.txt --rows rows/row_survivors.txt \
            --m ${{ matrix.m }} --output projected_survivors.txt > PROJECTED_REPORT.json
          cat PROJECTED_REPORT.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n30-d16-m${{ matrix.m }}-projected
          path: |
            PROJECTED_REPORT.json
            projected_survivors.txt
            rows/demands.txt
          if-no-files-found: error
          retention-days: 30
