name: scan orientation E0 max-s3

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-13-alternative-attacks-v1/prepare_orientation_e0_frontier.py'
      - 'project/research/general_n/2026-09-13-alternative-attacks-v1/scan_orientation_e0_frontier.cpp'
      - 'project/research/general_n/2026-09-13-alternative-attacks-v1/summarize_orientation_e0_scan.py'
      - '.github/workflows/scan-orientation-e0-maxs3.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare max-s <= 3 canonical shard
        working-directory: project/research/general_n/2026-09-13-alternative-attacks-v1
        run: python3 prepare_orientation_e0_frontier.py --max-s 3
      - name: Compile exact scanner
        working-directory: project/research/general_n/2026-09-13-alternative-attacks-v1
        run: g++ -O3 -std=c++17 -Wall -Wextra -pedantic scan_orientation_e0_frontier.cpp -o scan_orientation_e0_frontier
      - name: Run exact E0 scan
        working-directory: project/research/general_n/2026-09-13-alternative-attacks-v1
        run: |
          ./scan_orientation_e0_frontier ORIENTATION_E0_FRONTIER_INPUT.txt ORIENTATION_E0_MAXS3.tsv 2>&1 | tee ORIENTATION_E0_MAXS3_REPLAY.txt
          python3 summarize_orientation_e0_scan.py ORIENTATION_E0_MAXS3.tsv --output ORIENTATION_E0_MAXS3_SUMMARY.json
      - name: Upload exact scan
        uses: actions/upload-artifact@v4
        with:
          name: orientation-e0-maxs3
          path: |
            project/research/general_n/2026-09-13-alternative-attacks-v1/ORIENTATION_E0_FRONTIER_INPUT_VERIFICATION.json
            project/research/general_n/2026-09-13-alternative-attacks-v1/ORIENTATION_E0_MAXS3.tsv
            project/research/general_n/2026-09-13-alternative-attacks-v1/ORIENTATION_E0_MAXS3_REPLAY.txt
            project/research/general_n/2026-09-13-alternative-attacks-v1/ORIENTATION_E0_MAXS3_SUMMARY.json
