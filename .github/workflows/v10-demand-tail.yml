name: Check v10 demand-tail stability
on:
  push:
    branches: [main]
    paths:
      - 'project/research/general_n/2026-09-08-demand-tail-stability-v10/**'
      - '.github/workflows/v10-demand-tail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run exact rational regression
        run: |
          set -euo pipefail
          python3 -I -B project/research/general_n/2026-09-08-demand-tail-stability-v10/check_v10.py | tee v10-check.log
          grep -q '"status": "PASS"' v10-check.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v10-demand-tail-exact-check
          path: v10-check.log
          if-no-files-found: error
          retention-days: 7
