name: test endpoint-budget complement survivors

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-13-alternative-attacks-v1/make_endpoint_budget_scanner.py'
      - '.github/workflows/test-endpoint-budget-survivors.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate and compile strengthened scanner
        run: |
          set -euo pipefail
          cd project/research/general_n/2026-09-13-alternative-attacks-v1
          python3 make_endpoint_budget_scanner.py
          g++ -O3 -std=c++17 scan_endpoint_budget.generated.cpp -o /tmp/scan_endpoint_budget
      - name: State 122 E0
        run: |
          set -euo pipefail
          /tmp/scan_endpoint_budget 122 0
      - name: State 283 E7
        run: |
          set -euo pipefail
          /tmp/scan_endpoint_budget 283 7
