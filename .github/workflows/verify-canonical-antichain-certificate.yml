name: verify canonical Hall antichain certificate

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/CANONICAL_ANTICHAIN_CERTIFICATE.md'
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/verify_canonical_antichain_certificate.py'
      - '.github/workflows/verify-canonical-antichain-certificate.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run independent finite verifier
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 verify_canonical_antichain_certificate.py
      - name: Upload verification record
        uses: actions/upload-artifact@v4
        with:
          name: canonical-antichain-certificate-verification
          path: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/CANONICAL_ANTICHAIN_CERTIFICATE_VERIFICATION.json
