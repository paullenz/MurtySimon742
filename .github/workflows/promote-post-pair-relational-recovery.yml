name: promote post-pair relational recovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-13-alternative-attacks-v1/POST_PAIR_RELATIONAL_PROMOTE.flag'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate aggregate certificate and stage promotion
        working-directory: project/research/general_n/2026-09-13-alternative-attacks-v1
        run: python3 promote_post_pair_relational_recovery.py

      - name: Pin aggregate certificate hash in durability checker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          cert = Path('project/research/general_n/2026-09-13-alternative-attacks-v1/POST_PAIR_RELATIONAL_RECOVERY_EXCLUDED.tsv')
          checker = Path('tools/check_post_pair_relational_recovery.py')
          digest = hashlib.sha256(cert.read_bytes()).hexdigest()
          text = checker.read_text()
          old = 'EXPECTED_CERT_SHA256 = None'
          new = f'EXPECTED_CERT_SHA256 = "{digest}"'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('durability checker hash slot not found')
          checker.write_text(text)
          print('pinned', digest)
          PY

      - name: Run durability checks
        run: |
          python3 tools/check_n34_whole_state_ledger.py
          python3 tools/check_post_pair_relational_recovery.py

      - name: Check patch integrity
        run: git diff --check

      - name: Commit promoted checkpoint
        run: |
          if git diff --quiet; then
            echo 'No promotion changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CURRENT_STATE.md tools/check_post_pair_relational_recovery.py \
            project/research/general_n/2026-09-13-alternative-attacks-v1/README.md \
            project/research/general_n/2026-09-13-alternative-attacks-v1/POST_PAIR_RELATIONAL_RECOVERY.md \
            project/research/general_n/2026-09-13-alternative-attacks-v1/WHOLE_STATE_LEDGER.tsv
          git commit -m 'Promote 16 cross-checked post-pair relational closures'
          git push origin HEAD:main
