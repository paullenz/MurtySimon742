name: General RX-Hall n30 shared monotone-surface envelope

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/monotone_surface_shared_scan.py'
      - '.github/workflows/general-rx-hall-n30-shared-surface.yml'

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Run shared-surface reconnaissance
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          mkdir -p out
          .venv/bin/python -I -B "$R/monotone_surface_shared_scan.py" \
            --profiles "$R/checkpoints/N30_RESIDUAL_BUDGET_RUN_34338075220.json" \
            --a 13 --b 16 --dmax 11 --output out/SHARED_SURFACE.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n30-shared-monotone-surface-envelope
          path: out/SHARED_SURFACE.json
          if-no-files-found: error
          retention-days: 30
