name: Update README shared staircase frontier

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/update_readme_shared_frontier.py'
      - '.github/workflows/update-readme-shared-frontier.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Update README frontier
        run: python3 -I -B project/research/general_n/2026-09-09-rx-hall-v1/update_readme_shared_frontier.py
      - name: Commit with push retries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Update README to exact shared staircase frontier'
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase --autostash origin main
            sleep $((attempt*2))
          done
          exit 1
