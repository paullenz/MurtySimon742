name: verify canonical witness compatible-copy exactness

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/CANONICAL_WITNESS_COMPATIBLE_COPY_EXACTNESS.md'
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/verify_canonical_witness_compatible_copy_exactness.py'
      - '.github/workflows/verify-canonical-witness-compatible-copy-exactness.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run independent finite verifier
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 verify_canonical_witness_compatible_copy_exactness.py
      - name: Upload verification record
        uses: actions/upload-artifact@v4
        with:
          name: canonical-witness-compatible-copy-exactness-verification
          path: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/CANONICAL_WITNESS_COMPATIBLE_COPY_EXACTNESS_VERIFICATION.json
