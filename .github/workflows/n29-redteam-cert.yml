name: N29 red-team endpoint certificate integrity
on:
  push:
    branches: [main]
    paths:
      - 'project/reviews/n29/2026-09-08-redteam-restart-v1/N29_ENDPOINT_CERTIFICATES.json.gz.b64'
      - '.github/workflows/n29-redteam-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Decode and verify preserved endpoint certificates
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          base64 -d "$D/N29_ENDPOINT_CERTIFICATES.json.gz.b64" > /tmp/n29-endpoint.json.gz
          echo 'e506de04c3f8f3e347721cecb934963e7300b5ca6f3a39b9fa894b1787ea85c4  /tmp/n29-endpoint.json.gz' | sha256sum -c -
          gzip -dc /tmp/n29-endpoint.json.gz > /tmp/n29-endpoint.json
          echo '7f43ab2413700044e9d5753c7a65a2cb0654fec2bc1f0a4edb8958c342dda938  /tmp/n29-endpoint.json' | sha256sum -c -
          test "$(wc -c < /tmp/n29-endpoint.json.gz)" -eq 31151
          test "$(wc -c < /tmp/n29-endpoint.json)" -eq 56595
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/n29-endpoint.json'))
          assert d['schema']=='n29-redteam-endpoint-certificates-v1'
          assert len(d['cases'])==2
          print('PASS: two preserved endpoint certificates; hashes and sizes verified')
          PY
