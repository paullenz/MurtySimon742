name: N29 red-team preserve endpoint certificates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n29-redteam-cert.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver and checker dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev
          .venv/bin/python -I - <<'PY'
          import scipy
          assert scipy.__version__=='1.17.0'
          print('scipy',scipy.__version__)
          PY
          test -f /usr/include/boost/multiprecision/cpp_int.hpp
      - name: Extract hash-pinned inherited source
        run: |
          set -euo pipefail
          P=project/research/general_n/2026-09-07-direct-197-v8/MurtySimon_N28_197_Direct_v8.zip
          echo 'b753076ffc755066a0c57756be91cc5b265c163d869244d3aa65e3943799347b  '"$P" | sha256sum -c -
          unzip -q "$P" -d base
          mv base/* basepkg
      - name: Regenerate and exact-check the two endpoint-only cases
        run: |
          set -euo pipefail
          .venv/bin/python -I - <<'PY' 2>&1 | tee /tmp/n29-endpoint-generate.log
          from pathlib import Path
          import sys,json,gzip,hashlib
          base=Path('basepkg')
          sys.path[:0]=[str(base/'exploration'),str(base/'src'),str(base/'dependencies')]
          import joint,check_joint
          from total_degree import build_total
          from check_total import rebuild_total
          from common_lp import certificate,verify
          from check_constraints import translate,verify_named,signature

          specs=[
            {'position':68,'s':[1]*4+[3]*8,'rho':[1]*12+[3]*4},
            {'position':801,'s':[3]*5+[4]*7,'rho':[1]*7+[3]*4+[4]*5},
          ]
          cases=[]
          for spec in specs:
            s=spec['s'];rho=spec['rho'];t=2
            print('joint',spec['position'],flush=True)
            state=joint.propagate(s,rho,t=t,dmax=10)
            chk=check_joint.verify_row(s,rho,t=t,maxd=10)
            assert state['kind']=='survivor' and chk is not None
            for key,value in chk.items():
              assert json.loads(json.dumps(state[key]))==value
            print('endpoint model',spec['position'],flush=True)
            m=build_total(s,rho,state,t=t,local=False)
            ans=m.solve(); assert ans.status==2
            c=certificate(m); assert c is not None
            verify(m,c)
            named=translate(m,c)
            other=rebuild_total(s,rho,state,t=t,local=False)
            assert set(m.names)==other.variables
            assert {signature({m.names[j]:v for j,v in e.items()},b) for e,b in m.eq}==set(other.equalities)
            assert {signature({m.names[j]:v for j,v in e.items()},b) for e,b in m.ub}==set(other.inequalities)
            verify_named(other,named)
            cases.append({'position':spec['position'],'s':s,'rho':rho,'state':state,'certificate':named})
            print('endpoint',spec['position'],'PASS rhs',named['rhs'],flush=True)

          bundle={'schema':'n29-redteam-endpoint-certificates-v1','date':'2026-09-08','cases':cases}
          raw=(json.dumps(bundle,sort_keys=True,separators=(',',':'))+'\n').encode()
          gz=gzip.compress(raw,mtime=0)
          out=Path('project/reviews/n29/2026-09-08-redteam-restart-v1')
          (out/'N29_ENDPOINT_CERTIFICATES.json.gz').write_bytes(gz)
          manifest={
            'schema':'n29-redteam-endpoint-certificate-manifest-v1',
            'archive_sha256':'b753076ffc755066a0c57756be91cc5b265c163d869244d3aa65e3943799347b',
            'scipy':'1.17.0',
            'cases':[{'position':x['position'],'rhs':x['certificate']['rhs']} for x in cases],
            'json_bytes':len(raw),'gzip_bytes':len(gz),
            'json_sha256':hashlib.sha256(raw).hexdigest(),
            'gzip_sha256':hashlib.sha256(gz).hexdigest(),
            'verification':'joint disposition/state independently checked; endpoint model exact Farkas certificate verified; full named constraint sets compared to separately rebuilt system; named certificate exactly verified'
          }
          (out/'N29_ENDPOINT_CERTIFICATES_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2),flush=True)
          PY
      - name: Preserve generation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-redteam-endpoint-generation-log
          path: /tmp/n29-endpoint-generate.log
          if-no-files-found: warn
          retention-days: 30
      - name: Commit preserved evidence
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$D/N29_ENDPOINT_CERTIFICATES.json.gz" "$D/N29_ENDPOINT_CERTIFICATES_MANIFEST.json"
          if git diff --cached --quiet; then
            echo 'Evidence already identical; nothing to commit.'
            exit 0
          fi
          git commit -m 'Preserve clean-runner n29 endpoint certificates'
          git push
