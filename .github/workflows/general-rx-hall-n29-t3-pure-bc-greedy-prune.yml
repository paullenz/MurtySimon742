name: General RX-Hall n29 t3 pure-BC greedy prune

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t3-pure-bc-greedy-prune.yml'

permissions:
  contents: read

jobs:
  prune:
    strategy:
      fail-fast: false
      matrix:
        order: [normal,reverse]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t3 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 3 --output inputs
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 3 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Greedy prune ${{ matrix.order }}
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/n29_t3_pure_bc_greedy_prune.py" \
            --demands inputs/demands.json --rows inputs/row_survivors.txt \
            --dictionary-json "$R/N29_CANONICAL_DICTIONARY.json" \
            --order ${{ matrix.order }} --output out/${{ matrix.order }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-t3-pure-bc-prune-${{ matrix.order }}
          path: out/${{ matrix.order }}.json
          if-no-files-found: error
          retention-days: 30
