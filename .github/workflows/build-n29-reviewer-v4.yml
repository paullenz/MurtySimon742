name: Build n29 reviewer-v4 package

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/reviews/n29/2026-09-11-reviewer-v4/**'
      - '.github/workflows/build-n29-reviewer-v4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install paper toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils

      - name: Build v4 sources and PDFs
        run: |
          set -euo pipefail
          SRC=project/reviews/n29/2026-09-11-reviewer-v4
          BRIDGE=project/reviews/n29/2026-09-11-reviewer-v3/GRAPH_TO_MODEL_BRIDGE.md
          OUT=releases/n29-reviewer-v4
          mkdir -p "$OUT" n29-v4-renders

          cat > "$OUT/N29_Reviewer_Manuscript_v4.md" <<'EOF'
          ---
          title: "The Murty-Simon bound at order 29"
          subtitle: "Reviewer-v4 hand-reduced candidate proof"
          author: "Paul Lenz"
          date: "11 September 2026"
          geometry: margin=27mm
          fontsize: 11pt
          header-includes:
            - \usepackage{amsmath,amssymb,mathtools,booktabs,microtype}
            - \setlength{\emergencystretch}{2em}
          ---
          EOF
          cat "$SRC/PROOF.md" >> "$OUT/N29_Reviewer_Manuscript_v4.md"
          printf '\n\\newpage\n\n# Appendix A. Frozen self-contained Delta=16 graph-to-model bridge\n\n' >> "$OUT/N29_Reviewer_Manuscript_v4.md"
          tail -n +2 "$BRIDGE" >> "$OUT/N29_Reviewer_Manuscript_v4.md"

          cat > "$OUT/N29_Verification_Companion_v4.md" <<'EOF'
          ---
          title: "N=29 Murty-Simon candidate: verification companion"
          subtitle: "Reviewer-v4 dependency map, regressions, and audit boundaries"
          author: "Paul Lenz"
          date: "11 September 2026"
          geometry: margin=27mm
          fontsize: 11pt
          header-includes:
            - \usepackage{amsmath,amssymb,booktabs,microtype}
            - \setlength{\emergencystretch}{2em}
          ---
          EOF
          tail -n +2 "$SRC/VERIFICATION_COMPANION.md" >> "$OUT/N29_Verification_Companion_v4.md"

          pandoc --from=markdown+tex_math_single_backslash "$OUT/N29_Reviewer_Manuscript_v4.md" -o "$OUT/N29_Reviewer_Manuscript_v4.pdf" --pdf-engine=xelatex
          pandoc --from=markdown+tex_math_single_backslash "$OUT/N29_Verification_Companion_v4.md" -o "$OUT/N29_Verification_Companion_v4.pdf" --pdf-engine=xelatex

          cat > "$OUT/README.md" <<'EOF'
          # n=29 reviewer package v4

          **Current reviewer-facing edition - 11 September 2026.**

          Claim: `e(G) <= 210`, with equality exactly `K(14,15)`.

          Start with [N29_Reviewer_Manuscript_v4.pdf](N29_Reviewer_Manuscript_v4.pdf), then [N29_Verification_Companion_v4.pdf](N29_Verification_Companion_v4.pdf).

          Reviewer-v4 supersedes reviewer-v3 as the canonical n=29 review surface. The mathematical claim is unchanged, but the proof dependency surface is materially smaller: a hand threshold-tail argument excludes the entire `Delta=16, m>=210` branch in one step. Consequently the historical demand/residual enumeration, grouped LP, exact Farkas certificates, isolated-C lemma and upper-range Delta=16 finite checks are no longer logical dependencies of the theorem proof. They remain preserved as independent corroboration and audit history.

          The frozen reviewer-v3 graph-to-model bridge is appended to the v4 manuscript as Appendix A. The new scalar tail lemma is proved by hand in the main manuscript and independently regression-checked by exact integer programs.

          Reviewer-v3, reviewer-v2 and all earlier materials remain preserved unchanged for provenance. Independent mathematical review, independent computational reproduction, and novelty assessment remain open.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('releases/n29-reviewer-v4')
          files=['N29_Reviewer_Manuscript_v4.md','N29_Reviewer_Manuscript_v4.pdf','N29_Verification_Companion_v4.md','N29_Verification_Companion_v4.pdf','README.md']
          manifest={'schema':'n29-reviewer-v4-manifest','date':'2026-09-11','status':'candidate; independent review open','logical_delta16_route':'hand threshold-tail; no proof-critical computation','files':{}}
          for fn in files:
              b=(root/fn).read_bytes()
              manifest['files'][fn]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          (root/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Promote v4 in reviewer navigation
        run: python3 scripts/promote_n29_reviewer_v4.py

      - name: PDF preflight and render smoke check
        run: |
          set -euo pipefail
          for p in releases/n29-reviewer-v4/*.pdf; do
            pdfinfo "$p" | grep -E '^(Pages|Page size):'
            pdftotext "$p" /dev/null
            base=$(basename "$p" .pdf)
            pdftoppm -f 1 -singlefile -png -r 120 "$p" "n29-v4-renders/${base}" >/dev/null 2>&1
          done
          test -s n29-v4-renders/N29_Reviewer_Manuscript_v4.png
          test -s n29-v4-renders/N29_Verification_Companion_v4.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-reviewer-v4-${{ github.run_id }}
          path: |
            releases/n29-reviewer-v4/
            n29-v4-renders/
          retention-days: 30

      - name: Commit canonical v4 package and navigation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/n29-reviewer-v4 README.md START_HERE_FOR_REVIEWERS.md releases/REVIEW_READY_INDEX.md
          if git diff --cached --quiet; then
            echo 'n29 reviewer-v4 package already current.'
            exit 0
          fi
          git commit -m 'Publish N29 reviewer-v4 hand-proof package'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo 'Unable to publish n29 reviewer-v4 package after retries' >&2
          exit 1
