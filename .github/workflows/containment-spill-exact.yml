name: containment-spill-exact

on:
  push:
    paths:
      - '.github/workflows/containment-spill-exact.yml'
      - 'project/research/general_n/2026-09-13-constraint-respecting-cross-v1/assemble_exact_spill_witness.py'

permissions:
  contents: write

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify exact-demand witnesses
        shell: bash
        run: |
          set -o pipefail
          python project/research/general_n/2026-09-13-constraint-respecting-cross-v1/assemble_exact_spill_witness.py | tee /tmp/spill-exact.log
      - name: Upload result and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-spill-exact
          path: |
            project/research/general_n/2026-09-13-constraint-respecting-cross-v1/FULL_DOMAIN_SPILL_EXACT.json
            /tmp/spill-exact.log
          if-no-files-found: warn
      - name: Commit exact-demand result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/research/general_n/2026-09-13-constraint-respecting-cross-v1/FULL_DOMAIN_SPILL_EXACT.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record exact-demand spill witnesses for all combined survivors'
          git pull --rebase origin main
          git push
