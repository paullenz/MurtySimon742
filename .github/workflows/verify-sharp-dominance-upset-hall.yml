name: verify sharp dominance-upset Hall theorem

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/SHARP_DOMINANCE_UPSET_HALL.md'
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/verify_sharp_dominance_upset_hall.py'
      - '.github/workflows/verify-sharp-dominance-upset-hall.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run independent finite verifier
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 verify_sharp_dominance_upset_hall.py
      - name: Upload verification record
        uses: actions/upload-artifact@v4
        with:
          name: sharp-dominance-upset-hall-verification
          path: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/SHARP_DOMINANCE_UPSET_HALL_VERIFICATION.json
