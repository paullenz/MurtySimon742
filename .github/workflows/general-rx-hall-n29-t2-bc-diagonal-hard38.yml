name: General RX-Hall n29 t2 BC diagonal hard38 diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-bc-diagonal-hard38.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Hard38 diagonal diagnostic
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          B="$R/checkpoints/N29_BOUNDARY_SPECIALISATION_RUN_34364666552.json"
          mkdir -p out
          for STEP in b near all; do
            .venv/bin/python -I -B "$R/n29_t2_bc_diagonal_step_scan.py" \
              --mode hard38 --step-mode "$STEP" --sh-mode none \
              --dictionary-json "$R/N29_CANONICAL_DICTIONARY.json" \
              --boundary-json "$B" --output "out/${STEP}.json"
          done
          python3 - <<'PY' > out/FULL.json
          import glob,json
          R={p.split('/')[-1]:json.load(open(p)) for p in sorted(glob.glob('out/*.json')) if not p.endswith('FULL.json')}
          print(json.dumps({'schema':'n29-t2-bc-diagonal-hard38-v1','floating_point_reconnaissance_only':True,'results':R},indent=2,sort_keys=True))
          PY
          python3 - <<'PY'
          import json
          j=json.load(open('out/FULL.json'))
          for k,v in j['results'].items():print(k,v['success'],v.get('active_steps'),v.get('objective'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-t2-bc-diagonal-hard38
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_T2_BC_DIAGONAL_HARD38_RUN_${GITHUB_RUN_ID}.json"
          cp out/FULL.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 t2 BC diagonal hard38 ${GITHUB_RUN_ID}"
          git restore . || true
          for a in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            sleep $((a*2))
          done
          exit 1
