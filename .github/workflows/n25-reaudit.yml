name: Reaudit original n25 candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n25-reaudit.yml'
      - 'project/reviews/n25/2026-09-08-reaudit-v1/*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bands:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [control, equality_k2to5, k1_early, k1_late, k1_r26_s0, k1_r26_s1, k1_r26_s2, k1_r27_s0, k1_r27_s1, k1_r27_s2, k1_r28_s0, k1_r28_s1, k1_r28_s2, k1_r29_s0, k1_r29_s1, k1_r29_s2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare hash-pinned original evidence
        run: |
          set -euo pipefail
          mkdir records
          python3 --version > records/python-version.txt
          A=project/reviews/n25/2026-09-08-reaudit-v1
          sha256sum "$A"/*.py > records/source-sha256.txt
          python3 -I -B "$A/band_replay.py" prepare . work | tee records/prepare.log
          cp work/INPUT_INTEGRITY.json records/
      - name: Replay both unmodified generators and classifiers
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          A=project/reviews/n25/2026-09-08-reaudit-v1
          python3 -I -B "$A/band_replay.py" run work "$GROUP" --output "records/band-$GROUP.json" | tee records/replay.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n25-band-${{ matrix.group }}
          path: records/
          if-no-files-found: error
          retention-days: 30
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned inputs and repeat previous full audit
        run: |
          set -euo pipefail
          mkdir records
          A=project/reviews/n25/2026-09-08-reaudit-v1
          python3 -I -B "$A/band_replay.py" prepare . work | tee records/prepare.log
          python3 -I -B project/reviews/n25/2026-09-06-redteam-v1/run_redteam.py --reviewer-zip work/original-reviewer.zip --output previous-complete | tee records/previous-audit.log
          cp previous-complete/redteam_v1/*.json records/
          cp previous-complete/redteam_v1/*.log records/
      - name: Reconstruct terminal caps and exercise false certificates
        run: |
          set -euo pipefail
          A=project/reviews/n25/2026-09-08-reaudit-v1
          P=work/N25_Full_Chain_Candidate_2026-09-06_v1
          python3 -I -B "$A/terminal_reaudit.py" "$P" --output records/TERMINAL_REAUDIT.json | tee records/terminal.log
          python3 -I -B "$A/mutation_reaudit.py" "$P" --output records/mutations | tee records/mutation.log
          sha256sum "$A"/*.py > records/source-sha256.txt
          python3 --version > records/python-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n25-assurance
          path: records/
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: [bands, assurance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: n25-*
          path: gathered
      - name: Require every partition and assurance result
        run: |
          set -euo pipefail
          A=project/reviews/n25/2026-09-08-reaudit-v1
          python3 -I -B "$A/band_replay.py" aggregate gathered --output gathered/AGGREGATE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('gathered/n25-assurance')
          for name in ['arithmetic_results.json','structural_results.json','TERMINAL_REAUDIT.json']:
              assert json.loads((p/name).read_text())['status']=='PASS',name
          m=json.loads((p/'mutations/RESULTS.json').read_text())
          assert m['status']=='COMPLETED_WITH_DECLARED_TRUST_BOUNDARIES' and len(m['tests'])==12
          assert 'RED_TEAM_CHECKS_REPRODUCED' in (p/'previous-audit.log').read_text()
          print('All partitions and separate assurance: PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n25-reaudit-complete-records
          path: gathered/
          if-no-files-found: error
          retention-days: 30
