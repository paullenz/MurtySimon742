name: Red-team original n27 candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n27-redteam.yml'
      - 'project/reviews/n27/2026-09-08-redteam-v1/*.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble exact original archive and extract safely
        run: |
          set -euo pipefail
          mkdir audit-evidence
          python3 --version | tee audit-evidence/python-version.txt
          g++ --version > audit-evidence/compiler-version.txt
          python3 -I -B releases/n27-candidate-v1/assemble_archive.py | tee audit-evidence/assembly.log
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('releases/n27-candidate-v1/N27_Candidate_Evidence_2026-09-07_v1.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8381ed450859b9efa54fa6ec3c76bda786ec3fc31ec52732637c5346224caf3c'
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  p=Path(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not '\\' in i.filename
                  assert (i.external_attr >> 16) & 0o170000 != 0o120000
              assert z.testzip() is None
              z.extractall('original')
          print('Pinned original archive: PASS')
          PY
      - name: Strict JSON guard on every frozen C++ input
        run: |
          set -euo pipefail
          A=project/reviews/n27/2026-09-08-redteam-v1
          P=original/N27_Candidate_2026-09-07_v1
          python3 -I -B "$A/check_raw_inputs.py" "$P" --output audit-evidence/STRICT_INPUTS.json
      - name: Verify original files and rebuild all arithmetic
        run: |
          set -euo pipefail
          P=original/N27_Candidate_2026-09-07_v1
          python3 -I -B "$P/replay.py" --verify-only | tee audit-evidence/verify-original.log
          python3 -I -B "$P/replay.py" --replay --output "$GITHUB_WORKSPACE/fresh-n27" | tee audit-evidence/full-replay.log
      - name: Compare complete evidence with verified gzip-link normalization
        run: |
          set -euo pipefail
          A=project/reviews/n27/2026-09-08-redteam-v1
          python3 -I -B "$A/compare_replay.py" original/N27_Candidate_2026-09-07_v1 fresh-n27 --output audit-evidence/COMPARISON.json
      - name: Independent terminal cap and mutation checks
        run: |
          set -euo pipefail
          A=project/reviews/n27/2026-09-08-redteam-v1
          P=original/N27_Candidate_2026-09-07_v1
          python3 -I -B "$A/audit_n27.py" "$P" --output audit-evidence/FINAL_SOURCE_CAP_AUDIT.json
          python3 -I -B "$A/mutation_tests.py" "$P" --output audit-evidence/mutations
          sha256sum "$A"/*.py > audit-evidence/source-sha256.txt
      - name: Preserve completed and partial replay records
        if: always()
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('audit-evidence/replay-small-records.zip','w',zipfile.ZIP_DEFLATED) as z:
              if Path('fresh-n27').exists():
                  for p in sorted(Path('fresh-n27').rglob('*')):
                      if p.is_file() and p.stat().st_size<2000000 and p.suffix:
                          z.write(p,p.relative_to('fresh-n27'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n27-redteam-replay-records
          path: audit-evidence/
          if-no-files-found: error
          retention-days: 30
