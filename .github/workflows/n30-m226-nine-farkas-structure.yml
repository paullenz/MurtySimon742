name: N30 m226 nine-row Farkas structure

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/n30/2026-09-11-threshold-tail-v1/**'
      - '.github/workflows/n30-m226-nine-farkas-structure.yml'

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Analyse exact endpoint rays
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-11-threshold-tail-v1
          .venv/bin/python -I -B "$D/analyse_nine_farkas.py" > N30_M226_NINE_FARKAS_STRUCTURE.json
          python3 - <<'PY'
          import json
          r=json.load(open('N30_M226_NINE_FARKAS_STRUCTURE.json'))
          assert len(r['rows'])==9
          assert all(x['rhs']<0 for x in r['rows'])
          print('nine exact rays reconstructed and structurally classified')
          print('common categories:',r['structural_categories_present_in_every_certificate'])
          PY
      - name: Ablate structural constraint families on eight nontrivial rows
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-11-threshold-tail-v1
          .venv/bin/python -I -B "$D/ablate_eight_models.py" > N30_M226_EIGHT_MODEL_ABLATION.json
          python3 - <<'PY'
          import json
          r=json.load(open('N30_M226_EIGHT_MODEL_ABLATION.json'))
          assert len(r['rows'])==8
          print('eight-row category ablation complete')
          for x in r['rows']:
              print(x['tag'],x['single_drop_status'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n30-m226-nine-farkas-structure
          path: |
            N30_M226_NINE_FARKAS_STRUCTURE.json
            N30_M226_EIGHT_MODEL_ABLATION.json
          if-no-files-found: error
          retention-days: 30
