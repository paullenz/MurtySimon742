name: General RX-Hall n30 exact pruned shared potential

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/shared_exactify_pruned.py'
      - '.github/workflows/general-rx-hall-n30-shared-pruned-exact.yml'

permissions:
  contents: write

jobs:
  exactify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate sparse shared and greedy-pruned support
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          mkdir -p out
          .venv/bin/python -I -B "$R/shared_sparse_staircase_scan.py" \
            --bc-json "$R/checkpoints/N30_BC_UPPER_CUTGEN_RUN_34348486247.json" \
            --sh-json "$R/checkpoints/N30_EXCEPTION_SH_SUBSETS_RUN_34351236992.json" \
            --a 13 --b 16 --dmax 11 --output out/SHARED_SPARSE.json
          .venv/bin/python -I -B "$R/shared_greedy_prune.py" \
            --bc-json "$R/checkpoints/N30_BC_UPPER_CUTGEN_RUN_34348486247.json" \
            --shared-json out/SHARED_SPARSE.json \
            --a 13 --b 16 --dmax 11 --output out/SHARED_GREEDY_PRUNE.json
      - name: Exact integer verification
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/shared_exactify_pruned.py" \
            --bc-json "$R/checkpoints/N30_BC_UPPER_CUTGEN_RUN_34348486247.json" \
            --pruned-json out/SHARED_GREEDY_PRUNE.json \
            --a 13 --b 16 --dmax 11 --scale 1000000 --output out/SHARED_PRUNED_EXACT.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n30-shared-pruned-exact
          path: |
            out/SHARED_GREEDY_PRUNE.json
            out/SHARED_PRUNED_EXACT.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit exact checkpoint
        run: |
          set -euo pipefail
          P="project/research/general_n/2026-09-09-rx-hall-v1/checkpoints/N30_SHARED_PRUNED_EXACT_RUN_${GITHUB_RUN_ID}.json"
          cp out/SHARED_PRUNED_EXACT.json "$P"
          test -s "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve exact pruned shared potential run ${GITHUB_RUN_ID}"
          git stash push -u -m workflow-dirty || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
