name: General RX-Hall n29 t2 fixed-SH3 full-BC scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-fixed-sh3-fullbc.yml'

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        candidate: [M200,M1000]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 2 --output inputs
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 2 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Test ${{ matrix.candidate }} three-SH support across all t2
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/n29_t2_fixed_sh3_fullbc_scan.py" \
            --demands inputs/demands.json --rows inputs/row_survivors.txt \
            --dictionary-json "$R/N29_CANONICAL_DICTIONARY.json" \
            --min-sh-json "$R/checkpoints/N29_MIN_SH_FULLBC_HARD38_RUN_34382374167.json" \
            --candidate ${{ matrix.candidate }} --output out/${{ matrix.candidate }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-t2-fixed-sh3-${{ matrix.candidate }}
          path: out/${{ matrix.candidate }}.json
          if-no-files-found: error
          retention-days: 30
