name: N29 fully independent-code Delta16 verifier
on:
  push:
    branches: [main]
    paths:
      - 'project/research/n29/2026-09-08-independent-d16-v1/fresh_prepare.py'
      - 'project/research/n29/2026-09-08-independent-d16-v1/fresh_rows.cpp'
      - 'project/research/n29/2026-09-08-independent-d16-v1/fresh_joint.py'
      - 'project/research/n29/2026-09-08-independent-d16-v1/fresh_endpoint.py'
      - 'project/research/n29/2026-09-08-independent-d16-v1/run_independent.py'
      - 'project/research/n29/2026-09-08-independent-d16-v1/README.md'
      - '.github/workflows/n29-independent-d16.yml'
  workflow_dispatch:
concurrency:
  group: n29-independent-d16
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin numerical dependency
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
          .venv/bin/python - <<'PY'
          import scipy
          assert scipy.__version__ == '1.17.0'
          print('scipy', scipy.__version__)
          PY
      - name: Fresh demand generation and residual-row scan
        run: |
          set -euo pipefail
          I=project/research/n29/2026-09-08-independent-d16-v1
          g++ -O3 -std=c++17 "$I/fresh_rows.cpp" -o fresh_rows
          rm -rf prepared
          for t in 3 2; do
            mkdir -p prepared/t$t
            .venv/bin/python "$I/fresh_prepare.py" --t $t --output prepared/t$t
            ./fresh_rows prepared/t$t/demands.txt prepared/t$t/row_survivors.txt prepared/t$t/row_bands.txt $t > prepared/t$t/FRESH_ROWS_REPORT.json
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={
            3:({'support':261,'dual':779,'OPEN':339,'source_count':3488},1848957,206),
            2:({'OPEN':901,'source_count':6990,'support':116,'dual':1244},5765218,2087),
          }
          for t,(pc,raw,surv) in expected.items():
            p=Path(f'prepared/t{t}')
            a=json.loads((p/'FRESH_PREPARE_REPORT.json').read_text())
            b=json.loads((p/'FRESH_ROWS_REPORT.json').read_text())
            assert a['counts']==pc
            assert b['states']==raw and b['survivors']==surv
            assert b['low_k_rejections']==0
          print('fresh early finite domains: PASS')
          PY
      - name: Run fresh joint and endpoint verifier with exact certificates
        run: |
          set -euo pipefail
          I=project/research/n29/2026-09-08-independent-d16-v1
          rm -f "$I/N29_INDEPENDENT_D16_STATES.json.gz" "$I/N29_INDEPENDENT_D16_CERTIFICATES.json.gz" "$I/MANIFEST.json"
          .venv/bin/python "$I/run_independent.py" --prepared prepared --output "$I" --jobs 4 | tee /tmp/n29-independent-d16.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('project/research/n29/2026-09-08-independent-d16-v1')
          m=json.loads((p/'MANIFEST.json').read_text())
          assert m['status'].startswith('PASS')
          assert m['summary']['211']['exact_endpoint_certificates']==36
          assert m['summary']['210']['exact_endpoint_certificates']==593
          assert m['summary']['211']['joint_counts']=={'survivor':36,'source_matching':38,'source_hall':2,'joint_total_source':42}
          assert m['summary']['210']['joint_counts']=={'survivor':593,'source_matching':311,'source_hall':29,'label_domain':6,'total_source':58,'joint_total_source':222,'pair_hall':6}
          assert m['summary']['211']['rhs_max'] < 0 and m['summary']['210']['rhs_max'] < 0
          assert 'No inherited' in m['independence']
          print('fully fresh finite replay: PASS')
          PY
      - name: Upload complete independent evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-independent-d16-v1
          path: |
            project/research/n29/2026-09-08-independent-d16-v1/N29_INDEPENDENT_D16_STATES.json.gz
            project/research/n29/2026-09-08-independent-d16-v1/N29_INDEPENDENT_D16_CERTIFICATES.json.gz
            project/research/n29/2026-09-08-independent-d16-v1/MANIFEST.json
            prepared/t3/FRESH_PREPARE_REPORT.json
            prepared/t3/FRESH_ROWS_REPORT.json
            prepared/t2/FRESH_PREPARE_REPORT.json
            prepared/t2/FRESH_ROWS_REPORT.json
            /tmp/n29-independent-d16.log
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated independent evidence
        run: |
          set -euo pipefail
          I=project/research/n29/2026-09-08-independent-d16-v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$I/N29_INDEPENDENT_D16_STATES.json.gz" "$I/N29_INDEPENDENT_D16_CERTIFICATES.json.gz" "$I/MANIFEST.json"
          if git diff --cached --quiet; then
            echo 'Generated evidence is already identical.'
            exit 0
          fi
          git commit -m 'Preserve fully fresh n29 Delta16 exact evidence'
          git pull --rebase origin main
          git push
