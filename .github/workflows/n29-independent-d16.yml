name: N29 independent Delta16 late-stage verifier
on:
  push:
    branches: [main]
    paths:
      - 'project/research/n29/2026-09-08-independent-d16-v1/fresh_joint.py'
      - 'project/research/n29/2026-09-08-independent-d16-v1/fresh_endpoint.py'
      - 'project/research/n29/2026-09-08-independent-d16-v1/run_independent.py'
      - 'project/research/n29/2026-09-08-independent-d16-v1/README.md'
      - '.github/workflows/n29-independent-d16.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev
          .venv/bin/python - <<'PY'
          import scipy
          assert scipy.__version__ == '1.17.0'
          print('scipy', scipy.__version__)
          PY
          test -f /usr/include/boost/multiprecision/cpp_int.hpp
      - name: Verify and extract upstream preparation archive
        run: |
          set -euo pipefail
          P=project/research/general_n/2026-09-07-direct-197-v8/MurtySimon_N28_197_Direct_v8.zip
          echo 'b753076ffc755066a0c57756be91cc5b265c163d869244d3aa65e3943799347b  '"$P" | sha256sum -c -
          unzip -q "$P" -d base
          mv base/* basepkg
      - name: Rebuild upstream prepared inputs
        run: |
          set -euo pipefail
          A=project/research/n29/2026-09-08-delta16-direct-v1
          g++ -O3 -std=c++17 "$A/scan_rows.cpp" -o scan_rows
          g++ -O3 -std=c++17 "$A/check_rows.cpp" -o check_rows
          for t in 3 2; do
            mkdir -p prepared/t$t
            .venv/bin/python "$A/run.py" prepare --base basepkg --t $t --output prepared/t$t
            ./scan_rows prepared/t$t/demands.txt prepared/t$t/row_survivors.txt prepared/t$t/row_bands.txt $t > prepared/t$t/SCAN_REPORT.json
            ./check_rows prepared/t$t/demands.txt prepared/t$t/check_row_survivors.txt prepared/t$t/check_row_bands.txt $t > prepared/t$t/CHECK_ROWS_REPORT.json
            cmp prepared/t$t/row_survivors.txt prepared/t$t/check_row_survivors.txt
            cmp prepared/t$t/row_bands.txt prepared/t$t/check_row_bands.txt
            .venv/bin/python "$A/run.py" projected --t $t --root prepared/t$t
          done
      - name: Run fresh independent verifier and exact certificate generation
        run: |
          set -euo pipefail
          I=project/research/n29/2026-09-08-independent-d16-v1
          rm -f "$I/N29_INDEPENDENT_D16_STATES.json.gz" "$I/N29_INDEPENDENT_D16_CERTIFICATES.json.gz" "$I/MANIFEST.json"
          .venv/bin/python "$I/run_independent.py" --prepared prepared --output "$I" --jobs 4 | tee /tmp/n29-independent-d16.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('project/research/n29/2026-09-08-independent-d16-v1')
          m=json.loads((p/'MANIFEST.json').read_text())
          assert m['status'].startswith('PASS')
          assert m['summary']['211']['exact_endpoint_certificates']==36
          assert m['summary']['210']['exact_endpoint_certificates']==593
          assert m['summary']['211']['joint_counts']=={'survivor':36,'source_matching':38,'source_hall':2,'joint_total_source':42}
          assert m['summary']['210']['joint_counts']=={'survivor':593,'source_matching':311,'source_hall':29,'label_domain':6,'total_source':58,'joint_total_source':222,'pair_hall':6}
          assert m['summary']['211']['rhs_max'] < 0 and m['summary']['210']['rhs_max'] < 0
          print('independent manifest: PASS')
          PY
      - name: Upload independent evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-independent-d16-v1
          path: |
            project/research/n29/2026-09-08-independent-d16-v1/N29_INDEPENDENT_D16_STATES.json.gz
            project/research/n29/2026-09-08-independent-d16-v1/N29_INDEPENDENT_D16_CERTIFICATES.json.gz
            project/research/n29/2026-09-08-independent-d16-v1/MANIFEST.json
            /tmp/n29-independent-d16.log
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated independent evidence
        run: |
          set -euo pipefail
          I=project/research/n29/2026-09-08-independent-d16-v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$I/N29_INDEPENDENT_D16_STATES.json.gz" "$I/N29_INDEPENDENT_D16_CERTIFICATES.json.gz" "$I/MANIFEST.json"
          if git diff --cached --quiet; then
            echo 'Generated evidence is already identical.'
            exit 0
          fi
          git commit -m 'Preserve independent n29 Delta16 exact evidence'
          git push
