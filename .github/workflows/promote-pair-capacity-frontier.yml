name: promote pair-capacity frontier

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/promote_pair_capacity_frontier.py'
      - 'project/research/general_n/2026-09-13-alternative-attacks-v1/PAIR_CAPACITY_FRONTIER_EXCLUDED.tsv'
      - 'project/research/general_n/2026-09-13-alternative-attacks-v1/PAIR_CAPACITY_FRONTIER_AUDIT.md'
      - '.github/workflows/promote-pair-capacity-frontier.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote audited closure family
        run: python3 tools/promote_pair_capacity_frontier.py
      - name: Commit canonical ledger update
        run: |
          if git diff --quiet -- project/research/general_n/2026-09-13-alternative-attacks-v1/WHOLE_STATE_LEDGER.tsv; then
            echo 'Ledger already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/research/general_n/2026-09-13-alternative-attacks-v1/WHOLE_STATE_LEDGER.tsv
          git commit -m 'Promote 943 pair-capacity frontier closures'
          git push
