name: General RX-Hall n30 BC plus s-tail correction

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/rz_bc_plus_s_tails.py'
      - '.github/workflows/general-rx-hall-n30-bc-plus-s-tails.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Exact BC plus s-tail test
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          H="$R/checkpoints/N30_BC_UPPER_CUTGEN_RUN_34348486247.json"
          test -s "$H"
          mkdir -p out
          .venv/bin/python -I -B "$R/rz_bc_plus_s_tails.py" \
            --bc-json "$H" --a 13 --b 16 --dmax 11 \
            --output out/BC_PLUS_S_TAILS.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n30-bc-plus-s-tails
          path: out/BC_PLUS_S_TAILS.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit durable checkpoint with push retries
        run: |
          set -euo pipefail
          P="project/research/general_n/2026-09-09-rx-hall-v1/checkpoints/N30_BC_PLUS_S_TAILS_RUN_${GITHUB_RUN_ID}.json"
          cp out/BC_PLUS_S_TAILS.json "$P"
          test -s "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n30 BC plus s-tail run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            sleep $((attempt*2))
          done
          exit 1
