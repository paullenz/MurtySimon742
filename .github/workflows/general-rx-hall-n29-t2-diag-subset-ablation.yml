name: General RX-Hall n29 t2 diagonal subset ablation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-diag-subset-ablation.yml'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_t2_diag_subset_ablation.py'

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: c0
            cs: '0'
          - id: c1
            cs: '1'
          - id: c2
            cs: '2'
          - id: c01
            cs: '0,1'
          - id: c02
            cs: '0,2'
          - id: c12
            cs: '1,2'
          - id: c012
            cs: '0,1,2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 2 --output inputs
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 2 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Test ${{ matrix.id }}
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/n29_t2_diag_subset_ablation.py" \
            --c-values '${{ matrix.cs }}' --demands-json inputs/demands.json \
            --rows inputs/row_survivors.txt --output 'out/${{ matrix.id }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-t2-diag-${{ matrix.id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
