name: repair current state after E0 closures

on:
  push:
    paths:
      - '.github/workflows/repair-current-state-after-e0.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair durable handoff and synchronizer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          current = root / 'CURRENT_STATE.md'
          sync = root / 'tools/sync_n34_ledger_status.py'

          t = current.read_text()

          # Add the new reusable orientation target-capacity consequence to the
          # canonical general-theory list if it is not already present.
          anchor = '- exact low-demand incidence-capacity scanner extending the audited adjacent-family verifier to a broader seven-state ring without rewriting its mathematical search logic.\n'
          addition = (
              '- orientation target-capacity lemma for selected missing-B-edge orientations: if an edge is oriented '
              '`u->w`, then `q_u-1<=q_w+rho_w`; consequently, for every integer `k`, '
              '`sum_{w:q_w+rho_w<=k} p_w <= sum_{u:q_u<=k+1} q_u`. The exact E=0 replay closes '
              'states 77 and 60 with a minimum six-incidence deficit.\n'
          )
          if addition not in t:
              if anchor not in t:
                  raise SystemExit('canonical general-theory anchor not found')
              t = t.replace(anchor, anchor + addition, 1)

          # Insert a durable latest-closures section before the aggregate record.
          marker = '## Current whole-state generalisation record\n'
          latest = '''## Latest closures: states 77 and 60\n\nThe mixed demand-two/demand-three joint-Hall refinement made every previously weak positive-excess layer strict in states 77 and 60, leaving only `E=0` in each state. The remaining exact-demand layer is excluded by [`ORIENTATION_TARGET_CAPACITY.md`](project/research/general_n/2026-09-13-alternative-attacks-v1/ORIENTATION_TARGET_CAPACITY.md).\n\nFor a selected orientation of a missing `B`-edge `u->w`, every other selected label at `u` must also be cross-adjacent to `w`, giving\n\n```text\nq_u - 1 <= q_w + rho_w.\n```\n\nHence every threshold `k` obeys the necessary target-capacity cut\n\n```text\nsum_{w:q_w+rho_w<=k} p_w <= sum_{u:q_u<=k+1} q_u.\n```\n\nThe independent exact verifier [`verify_e0_orientation_capacity.py`](project/research/general_n/2026-09-13-alternative-attacks-v1/verify_e0_orientation_capacity.py) enumerated all `201,670` `E=0` q-profiles for state 77 and all `253,001` for state 60. No profile passed; the closest profile in either state was still six incidences short. GitHub Actions run `34785891328` completed green and its replay output is preserved.\n\nWhole-state records are [`STATE_77_WHOLE_STATE.md`](project/research/general_n/2026-09-13-alternative-attacks-v1/STATE_77_WHOLE_STATE.md) and [`STATE_60_WHOLE_STATE.md`](project/research/general_n/2026-09-13-alternative-attacks-v1/STATE_60_WHOLE_STATE.md). They are entries 15 and 16 of the canonical union; ordinal wording in older parallel notes is non-authoritative.\n\n'''
          if '## Latest closures: states 77 and 60' not in t:
              if marker not in t:
                  raise SystemExit('whole-state record marker not found')
              t = t.replace(marker, latest + marker, 1)

          # The seven-state table is historically useful, but its original weak
          # layers are no longer the current state. Preserve the old gaps while
          # explicitly marking the later closures.
          t = re.sub(
              r'\| 77 \| `-7` \| `E=0 \(-7\), 1 \(-3\), 3 \(0\), 4 \(0\), 5 \(0\), 6 \(-1\), 7 \(0\)` \|',
              '| 77 | `-7` in the original extension scan | historical weak layers `E=0,1,3,4,5,6,7`; **subsequently whole-state closed** |',
              t,
              count=1,
          )
          t = re.sub(
              r'\| 60 \| `-11` \| `E=0 \(-11\), 1 \(-5\), 2 \(-2\), 3 \(-3\), 4 \(-3\), 5 \(-5\), 6 \(-2\), 7 \(-3\)` \|',
              '| 60 | `-11` in the original extension scan | historical weak layers `E=0,...,7`; **subsequently whole-state closed** |',
              t,
              count=1,
          )
          t = re.sub(
              r'This is a useful compression\.[^\n]*\n',
              'This table is now historical triage rather than the live frontier: **all seven states in this extension ring (153, 283, 231, 154, 122, 77 and 60) are whole-state closed** after the later endpoint-class, joint-Hall and orientation-capacity refinements. The original nonpositive layers remain recorded because failures and intermediate frontiers are part of the audit trail.\n',
              t,
              count=1,
          )
          t = re.sub(
              r'After state 153, \*\*state 283 has only one exceptional layer \(`E=7`\) and state 122 only one \(`E=0`\)\*\*\. They are the immediate best closure targets\. These are necessary-condition scan survivors, not graphs\.\n',
              '',
              t,
              count=1,
          )

          # Replace stale priorities with the actual post-closure programme.
          priorities = '''## Current research priorities\n\n### P1. Generalise and audit the orientation target-capacity lemma\n\nExtract the state-77/state-60 E=0 argument into the strongest useful selection-free or selected-orientation form, test its exact hypotheses against the canonical bridge, and look for subset/threshold strengthenings. Preserve counterexamples to any over-strong formulation.\n\n### P2. Rescan the remaining frozen catalogue\n\nApply the orientation target-capacity cut together with the joint endpoint-class Hall refinement and existing incidence-capacity machinery to the remaining 4,568 frozen scalar survivors. Rank the next whole-state targets by the size and structure of their residual layers, preserving full inputs, outputs, hashes and failures.\n\n### P3. Extract a symbolic mixed-class Hall/flow theorem\n\nGeneralise [`ENDPOINT_CLASS_PACKING.md`](project/research/general_n/2026-09-13-alternative-attacks-v1/ENDPOINT_CLASS_PACKING.md), especially the joint demand-two/demand-three threshold system that closed state 231, and relate it cleanly to the new orientation target-capacity cut. Seek a parameterised theorem rather than accumulating state-specific patches.\n\n### P4. Strengthen independent audit and reproduction\n\nPrioritise external checking of the canonical bridge, the mixed-class Hall projection, the orientation target-capacity lemma and the state-77/state-60 exact replay. Internal green CI remains replay evidence, not external acceptance.\n\n### P5. Continue independent routes and preservation\n\nContinue selection-free, maximum-cut and other genuinely different approaches where they add information. Preserve failed approaches, counterexamples, solver timeouts and corrected interpretations; never infer proof from timeout or numerical infeasibility alone.\n\n'''
          t, n = re.subn(
              r'## Current research priorities\n.*?(?=## Research/preservation rules)',
              priorities,
              t,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'current priorities replacement count {n}')
          current.write_text(t)

          s = sync.read_text()
          # Keep the alternative-attacks README priority current on future syncs.
          old_alt = '"**Current priority:** apply the joint endpoint-class Hall refinement to states 77 and 60, then extract the strongest reusable mixed-class Hall/flow theorem and rescan the remaining frozen N34 catalogue.",'
          new_alt = '"**Current priority:** generalise and audit the orientation target-capacity lemma that closed states 77 and 60, combine it with the joint endpoint-class Hall refinement, and rescan the remaining frozen N34 catalogue for the next quantified closures.",'
          if old_alt in s:
              s = s.replace(old_alt, new_alt, 1)

          new_priority_template = '''priority = f"""## Current research priorities\n\n### P1. Generalise and audit the orientation target-capacity lemma\n\nExtract the state-77/state-60 E=0 argument into the strongest useful selection-free or selected-orientation form, test its exact hypotheses against the canonical bridge, and look for subset/threshold strengthenings. Preserve counterexamples to any over-strong formulation.\n\n### P2. Rescan the remaining frozen catalogue\n\nApply the orientation target-capacity cut together with the joint endpoint-class Hall refinement and existing incidence-capacity machinery to the remaining {survivors:,} frozen scalar survivors. Rank the next whole-state targets by the size and structure of their residual layers, preserving full inputs, outputs, hashes and failures.\n\n### P3. Extract a symbolic mixed-class Hall/flow theorem\n\nGeneralise [`ENDPOINT_CLASS_PACKING.md`](project/research/general_n/2026-09-13-alternative-attacks-v1/ENDPOINT_CLASS_PACKING.md), especially the joint demand-two/demand-three threshold system that closed state 231, and relate it cleanly to the new orientation target-capacity cut. Seek a parameterised theorem rather than accumulating state-specific patches.\n\n### P4. Strengthen independent audit and reproduction\n\nPrioritise external checking of the canonical bridge, the mixed-class Hall projection, the orientation target-capacity lemma and the state-77/state-60 exact replay. Internal green CI remains replay evidence, not external acceptance.\n\n### P5. Continue independent routes and preservation\n\nContinue selection-free, maximum-cut and other genuinely different approaches where they add information. Preserve failed approaches, counterexamples, solver timeouts and corrected interpretations; never infer proof from timeout or numerical infeasibility alone.\n\n"""'''
          s, n = re.subn(
              r'priority = f"""## Current research priorities\n.*?\n"""',
              new_priority_template,
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'synchronizer priority-template replacement count {n}')
          sync.write_text(s)
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/repair-current-state-after-e0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md tools/sync_n34_ledger_status.py .github/workflows/repair-current-state-after-e0.yml
          git commit -m 'Update current state after state77 and state60 closures'
          git push
