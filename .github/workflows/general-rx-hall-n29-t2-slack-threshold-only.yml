name: General RX-Hall n29 t2 pure slack thresholds

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-slack-threshold-only.yml'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_t2_slack_threshold_only.py'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 2 --output inputs
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 2 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Scan demand45 and hard38
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          B="$R/checkpoints/N29_BOUNDARY_SPECIALISATION_RUN_34364666552.json"
          for MODE in demand45 hard38; do
            for STEP in b near all; do
              .venv/bin/python -I -B "$R/n29_t2_slack_threshold_only.py" \
                --mode "$MODE" --step-mode "$STEP" --boundary-json "$B" \
                --output "out/${MODE}_${STEP}.json"
            done
          done
      - name: Escalate successful hard38 modes to all 902
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          for STEP in b near all; do
            P="out/hard38_${STEP}.json"
            if python3 -c "import json,sys;sys.exit(0 if json.load(open(sys.argv[1]))['success'] else 1)" "$P"; then
              .venv/bin/python -I -B "$R/n29_t2_slack_threshold_only.py" \
                --mode t2 --step-mode "$STEP" --demands-json inputs/demands.json \
                --rows inputs/row_survivors.txt --output "out/all902_${STEP}.json"
            fi
          done
      - name: Combine results
        run: |
          python3 - <<'PY' > out/FULL.json
          import glob,json
          R={}
          for p in sorted(glob.glob('out/*.json')):
              if p.endswith('FULL.json'): continue
              R[p.split('/')[-1]]=json.load(open(p))
          print(json.dumps({'schema':'n29-t2-slack-threshold-only-batch-v1','floating_point_reconnaissance_only':True,'results':R},indent=2,sort_keys=True))
          PY
          python3 - <<'PY'
          import json
          j=json.load(open('out/FULL.json'))
          for k,v in j['results'].items(): print(k,'success=',v['success'],'steps=',v.get('active_steps'),'objective=',v.get('objective'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-t2-slack-threshold-only
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit durable result
        if: always()
        run: |
          set -euo pipefail
          test -s out/FULL.json || exit 0
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_T2_SLACK_THRESHOLD_ONLY_RUN_${GITHUB_RUN_ID}.json"
          cp out/FULL.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 t2 pure slack thresholds ${GITHUB_RUN_ID}" || exit 0
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            sleep $((attempt*2))
          done
          exit 1
