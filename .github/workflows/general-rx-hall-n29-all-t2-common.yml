name: General RX-Hall n29 all-t2 common 16-shape potential

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_all_t2_common_potential.py'
      - '.github/workflows/general-rx-hall-n29-all-t2-common.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 minimal frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 2 --output inputs
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 2 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Test one common 16-shape potential across all 902 profiles
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/n29_all_t2_common_potential.py" \
            --demands-json inputs/demands.json --rows inputs/row_survivors.txt \
            --support-json "$R/checkpoints/N29_COMMON_ACTIVE_EXACT_RUN_34371839791.json" \
            --a 12 --b 16 --dmax 10 --t 2 --output out/ALL_T2_COMMON.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-all-t2-common-16-shape
          path: out/ALL_T2_COMMON.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit durable checkpoint
        if: always()
        run: |
          set -euo pipefail
          test -s out/ALL_T2_COMMON.json || exit 0
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_ALL_T2_COMMON_RUN_${GITHUB_RUN_ID}.json"
          cp out/ALL_T2_COMMON.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 all-t2 common-potential run ${GITHUB_RUN_ID}" || exit 0
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase --autostash origin main
            sleep $((attempt*2))
          done
          exit 1
