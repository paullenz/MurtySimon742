name: test class-packing survivors

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-13-alternative-attacks-v1/make_class_packing_scanner.py'
      - '.github/workflows/test-class-packing-survivors.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate and compile class-packing scanner
        run: |
          set -euo pipefail
          cd project/research/general_n/2026-09-13-alternative-attacks-v1
          python3 make_class_packing_scanner.py
          g++ -O3 -std=c++17 scan_class_packing.generated.cpp -o /tmp/scan_class_packing
      - name: State 122 E0
        run: |
          set -euo pipefail
          /tmp/scan_class_packing 122 0
      - name: State 283 E7
        run: |
          set -euo pipefail
          /tmp/scan_class_packing 283 7
