name: verify q-stratified mincut exactness

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/Q_STRATIFIED_MINCUT_EXACTNESS.md'
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/verify_q_stratified_mincut_exactness.py'
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/Q_STRATIFIED_MINCUT_EXACTNESS_VERIFICATION.json'
      - '.github/workflows/verify-q-stratified-mincut-exactness.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay q-stratified mincut verification
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 verify_q_stratified_mincut_exactness.py > /tmp/Q_STRATIFIED_MINCUT_EXACTNESS_VERIFICATION.json
      - name: Require frozen output equality
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: diff -u Q_STRATIFIED_MINCUT_EXACTNESS_VERIFICATION.json /tmp/Q_STRATIFIED_MINCUT_EXACTNESS_VERIFICATION.json
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: q-stratified-mincut-exactness-verification
          path: /tmp/Q_STRATIFIED_MINCUT_EXACTNESS_VERIFICATION.json
