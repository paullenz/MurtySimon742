name: Check canonical bridge Lean slice

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-07-stability-spare-sources-v9/formal/QuasiCore.lean'
      - 'project/research/general_n/2026-09-07-stability-spare-sources-v9/formal/CanonicalBridgeSlice.lean'
      - 'project/research/general_n/2026-09-07-stability-spare-sources-v9/formal/CanonicalBridgeSliceV2.lean'
      - '.github/workflows/canonical-bridge-lean-slice.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install fixed official Lean 4.19.0 toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          sha256sum "$RUNNER_TEMP/lean.tar.zst" > lean-toolchain-sha256.txt
          tar --zstd -xf "$RUNNER_TEMP/lean-4.19.0-linux.tar.zst" -C "$RUNNER_TEMP" 2>/dev/null || tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Check core and canonical extensions
        run: |
          set -euo pipefail
          D=project/research/general_n/2026-09-07-stability-spare-sources-v9/formal
          lean --version | tee lean-version.txt
          sha256sum "$D/QuasiCore.lean" "$D/CanonicalBridgeSlice.lean" "$D/CanonicalBridgeSliceV2.lean" > checked-source-sha256.txt
          (
            cd "$D"
            lean -o QuasiCore.olean QuasiCore.lean 2>&1 | tee "$GITHUB_WORKSPACE/quasi-core-check.log"
            LEAN_PATH=. lean -o CanonicalBridgeSlice.olean CanonicalBridgeSlice.lean 2>&1 | tee "$GITHUB_WORKSPACE/canonical-bridge-slice-check.log"
            LEAN_PATH=. lean CanonicalBridgeSliceV2.lean 2>&1 | tee "$GITHUB_WORKSPACE/canonical-bridge-slice-v2-check.log"
          )
          if grep -E 'sorryAx|warning:|error:' quasi-core-check.log canonical-bridge-slice-check.log canonical-bridge-slice-v2-check.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-bridge-lean-slice-${{ github.run_id }}
          path: |
            quasi-core-check.log
            canonical-bridge-slice-check.log
            canonical-bridge-slice-v2-check.log
            lean-version.txt
            lean-toolchain-sha256.txt
            checked-source-sha256.txt
          if-no-files-found: warn
          retention-days: 30
