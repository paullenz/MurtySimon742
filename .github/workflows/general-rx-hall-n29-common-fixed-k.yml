name: General RX-Hall n29 common potential fixed-cardinality tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_common_support_feasibility.py'
      - '.github/workflows/general-rx-hall-n29-common-fixed-k.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        k: [10,11,12,13]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Test K-shape feasibility
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          mkdir -p out
          .venv/bin/python -I -B "$R/n29_common_support_feasibility.py" \
            --boundary-json "$R/checkpoints/N29_BOUNDARY_SPECIALISATION_RUN_34364666552.json" \
            --support-json "$R/checkpoints/N30_SHARED_MIN_SUPPORT_RUN_34361230390.json" \
            --correction-json "$R/checkpoints/N29_PAIRWISE_CORRECTION_RUN_34365472773.json" \
            --a 12 --b 16 --dmax 10 --k ${{ matrix.k }} --big-m 200 --time-limit 600 \
            --output out/K${{ matrix.k }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-common-fixed-k-${{ matrix.k }}
          path: out/K${{ matrix.k }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'n29-common-fixed-k-*'
          path: reports
      - name: Aggregate K results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          docs=[json.load(open(p)) for p in pathlib.Path('reports').rglob('K*.json')]
          docs.sort(key=lambda x:x['k'])
          out={'schema':'n29-common-fixed-k-aggregate-v1','results':[{k:d.get(k) for k in ('k','verdict','status','message','BC_count','SH_count','support_count','mip_gap','mip_node_count')} for d in docs]}
          pathlib.Path('out').mkdir(exist_ok=True);pathlib.Path('out/AGGREGATE.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-common-fixed-k-aggregate
          path: out/AGGREGATE.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit aggregate checkpoint
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_COMMON_FIXED_K_RUN_${GITHUB_RUN_ID}.json"
          cp out/AGGREGATE.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 fixed-k common support run ${GITHUB_RUN_ID}"
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase --autostash origin main
            sleep $((attempt*2))
          done
          exit 1
