name: Audit N30 late-LP embedding

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/n30/2026-09-11-late-lp-embedding-audit-v1/**'
      - 'project/research/n30/2026-09-08-minimal-kernel-recon-v1/n30_threshold_model.py'
      - '.github/workflows/audit-n30-late-lp-embedding.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Run exact N30 embedding regression
        run: python project/research/n30/2026-09-11-late-lp-embedding-audit-v1/microstate_embedding_audit.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          p='project/research/n30/2026-09-11-late-lp-embedding-audit-v1/MICROSTATE_AUDIT_REPORT.json'
          r=json.load(open(p))
          assert r['status']=='PASS' and r['all_production_rows_satisfied'] is True
          assert len(r['fixtures'])==2
          assert all(f['corrected_n30']['violations']==0 for f in r['fixtures'])
          print(json.dumps(r,indent=2))
          PY
      - name: Commit receipt
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/research/n30/2026-09-11-late-lp-embedding-audit-v1/MICROSTATE_AUDIT_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record N30 late-LP embedding audit receipt'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
