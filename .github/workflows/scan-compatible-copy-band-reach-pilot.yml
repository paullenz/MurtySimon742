name: scan compatible-copy band Hall reach pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/make_compatible_copy_band_reach_scanner.py'
      - '.github/workflows/scan-compatible-copy-band-reach-pilot.yml'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare same deterministic 1/256 pilot shard
        working-directory: project/research/general_n/2026-09-13-alternative-attacks-v1
        run: python3 prepare_pair_capacity_frontier.py --mod 256 --rem 16 --output COMPATIBLE_COPY_BAND_REACH_PILOT_INPUT.txt

      - name: Generate canonical antichain scanner
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 make_antichain_stats_scanner.py

      - name: Add coarse-band instrumentation
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 make_band_reach_scanner.py

      - name: Add compatible-copy instrumentation
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 make_compatible_copy_band_reach_scanner.py

      - name: Compile scanner
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: g++ -O3 -std=c++17 -Wall -Wextra -pedantic scan_compatible_copy_band_reach_stats.cpp -o scan_compatible_copy_band_reach_stats

      - name: Run pilot
        run: |
          project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/scan_compatible_copy_band_reach_stats \
            project/research/general_n/2026-09-13-alternative-attacks-v1/COMPATIBLE_COPY_BAND_REACH_PILOT_INPUT.txt \
            COMPATIBLE_COPY_BAND_REACH_PILOT.tsv \
            2>&1 | tee COMPATIBLE_COPY_BAND_REACH_PILOT_REPLAY.txt

      - name: Summarize and assert frozen comparison
        run: |
          python3 - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open('COMPATIBLE_COPY_BAND_REACH_PILOT.tsv'),delimiter='\t'))
          target=sum(int(r['targethall_fail']) for r in rows)
          bandfail=sum(int(r['band_fail']) for r in rows)
          bandpass=sum(int(r['band_pass']) for r in rows)
          ccfail=sum(int(r['ccband_fail']) for r in rows)
          ccpass=sum(int(r['ccband_pass']) for r in rows)
          if bandfail+bandpass != target:
              raise SystemExit(f'coarse-band accounting mismatch: {bandfail}+{bandpass}!={target}')
          if ccfail+ccpass != target:
              raise SystemExit(f'compatible-copy accounting mismatch: {ccfail}+{ccpass}!={target}')
          if target != 205919:
              raise SystemExit(f'frozen target-Hall count changed: {target} != 205919')
          if bandfail != 205918 or bandpass != 1:
              raise SystemExit(f'frozen coarse-band comparison changed: fail={bandfail} pass={bandpass}')
          if ccfail != 205919 or ccpass != 0:
              raise SystemExit(f'compatible-copy pilot did not detect all target failures: fail={ccfail} pass={ccpass}')
          summary={
              'schema':'compatible-copy-band-reach-pilot-v1',
              'states':len(rows),
              'profiles_tested':sum(int(r['profiles_tested']) for r in rows),
              'target_hall_failure_profiles':target,
              'coarse_band_detected':bandfail,
              'coarse_band_passed_despite_target_failure':bandpass,
              'compatible_copy_band_detected':ccfail,
              'compatible_copy_band_passed_despite_target_failure':ccpass,
              'compatible_copy_detection_fraction':ccfail/target if target else None,
              'promotion_status':'RECONNAISSANCE_ONLY',
              'external_review':'OPEN',
              'assertions':'Frozen coarse-band counts reproduced and compatible-copy refinement detects every exact target-Hall failure in the deterministic 15-state pilot.'
          }
          open('COMPATIBLE_COPY_BAND_REACH_PILOT_SUMMARY.json','w').write(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: compatible-copy-band-reach-pilot
          path: |
            project/research/general_n/2026-09-13-alternative-attacks-v1/COMPATIBLE_COPY_BAND_REACH_PILOT_INPUT.txt
            project/research/general_n/2026-09-13-alternative-attacks-v1/COMPATIBLE_COPY_BAND_REACH_PILOT_INPUT_VERIFICATION.json
            project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/scan_compatible_copy_band_reach_stats.cpp
            COMPATIBLE_COPY_BAND_REACH_PILOT.tsv
            COMPATIBLE_COPY_BAND_REACH_PILOT_REPLAY.txt
            COMPATIBLE_COPY_BAND_REACH_PILOT_SUMMARY.json
