name: General RX-Hall n29 demand45 pair minimum support

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-demand45-pair-min.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Search demand45 pair lower-bound witness
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          mkdir -p out
          .venv/bin/python -I -B "$R/n29_demand45_pair_min_support_scan.py" \
            --boundary-json "$R/checkpoints/N29_BOUNDARY_SPECIALISATION_RUN_34364666552.json" \
            --support-json "$R/checkpoints/N29_COMMON_MIN_SUPPORT_RUN_34368079621.json" \
            --correction-json "$R/checkpoints/N29_PAIRWISE_CORRECTION_RUN_34365472773.json" \
            --time-limit 90 \
            --output out/DEMAND45_PAIR_MIN.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n29-demand45-pair-min
          path: out/DEMAND45_PAIR_MIN.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit durable checkpoint
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_DEMAND45_PAIR_MIN_RUN_${GITHUB_RUN_ID}.json"
          cp out/DEMAND45_PAIR_MIN.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 demand45 pair-min run ${GITHUB_RUN_ID}" || exit 0
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            sleep $((attempt*2))
          done
          exit 1
