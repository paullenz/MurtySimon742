name: General RX-Hall n29 t2 all902 rectdiag L1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-all902-rectdiag-l1.yml'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_t2_all902_rectdiag_l1.py'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 2 --output inputs
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 2 > inputs/MINIMAL_ROWS_REPORT.json
      - name: L1 decompose all 902
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/n29_t2_all902_rectdiag_l1.py" \
            --demands-json inputs/demands.json --rows inputs/row_survivors.txt --output out/RESULT.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-t2-all902-rectdiag-l1
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit durable result
        if: always()
        run: |
          set -euo pipefail
          test -s out/RESULT.json || exit 0
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_T2_ALL902_RECTDIAG_L1_RUN_${GITHUB_RUN_ID}.json"
          cp out/RESULT.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 t2 all902 rectdiag L1 ${GITHUB_RUN_ID}" || exit 0
          git restore . || true
          for a in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git restore . || true
            git clean -fd -e .venv || true
            git pull --rebase origin main
            sleep $((a*2))
          done
          exit 1
