name: General RX-Hall cross-order n30 single obstruction matrix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-cross-order-n30-single-obstruction-matrix.yml'

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3,4,5,6]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 and t3 frontiers
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs/t2 inputs/t3 out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          for t in 2 3; do
            .venv/bin/python -I -B "$D/minimal_prepare.py" --t $t --output inputs/t$t
            ./minimal_rows inputs/t$t/demands.txt inputs/t$t/row_survivors.txt inputs/t$t/row_bands.txt $t > inputs/t$t/MINIMAL_ROWS_REPORT.json
          done
      - name: Test n30 profile ${{ matrix.index }}
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/cross_order_n30_single_obstruction_scan.py" \
            --t2-demands inputs/t2/demands.json --t2-rows inputs/t2/row_survivors.txt \
            --t3-demands inputs/t3/demands.json --t3-rows inputs/t3/row_survivors.txt \
            --n30-json "$R/checkpoints/N30_BC_UPPER_CUTGEN_RUN_34348486247.json" \
            --support-json "$R/checkpoints/N29_COMMON_ACTIVE_EXACT_RUN_34371839791.json" \
            --only-index ${{ matrix.index }} \
            --output out/N30_SINGLE_${{ matrix.index }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-order-n30-single-${{ matrix.index }}
          path: out/N30_SINGLE_${{ matrix.index }}.json
          if-no-files-found: error
          retention-days: 30
