name: General RX-Hall n29 dictionary catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_dictionary_catalog.py'
      - '.github/workflows/general-rx-hall-n29-dictionary-catalog.yml'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build canonical dictionary catalog
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          python3 -I -B "$R/n29_dictionary_catalog.py" \
            --base-json "$R/checkpoints/N30_SHARED_MIN_SUPPORT_RUN_34361230390.json" \
            --correction-json "$R/checkpoints/N29_PAIRWISE_CORRECTION_RUN_34365472773.json" \
            --dmax 10 --output "$R/N29_CANONICAL_DICTIONARY.json"
      - name: Commit catalog
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/research/general_n/2026-09-09-rx-hall-v1/N29_CANONICAL_DICTIONARY.json
          git commit -m "Materialize canonical n29 staircase dictionary" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            python3 -I -B project/research/general_n/2026-09-09-rx-hall-v1/n29_dictionary_catalog.py \
              --base-json project/research/general_n/2026-09-09-rx-hall-v1/checkpoints/N30_SHARED_MIN_SUPPORT_RUN_34361230390.json \
              --correction-json project/research/general_n/2026-09-09-rx-hall-v1/checkpoints/N29_PAIRWISE_CORRECTION_RUN_34365472773.json \
              --dmax 10 --output project/research/general_n/2026-09-09-rx-hall-v1/N29_CANONICAL_DICTIONARY.json
            git add project/research/general_n/2026-09-09-rx-hall-v1/N29_CANONICAL_DICTIONARY.json
            git commit -m "Materialize canonical n29 staircase dictionary" || true
          done
          exit 1
