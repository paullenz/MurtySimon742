name: General RX-Hall n29 t2 full min-hinge scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-full-min-hinge.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 2 --output inputs
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 2 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Scan demand45 and hard38 with complete min-hinge family
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          B="$R/checkpoints/N29_BOUNDARY_SPECIALISATION_RUN_34364666552.json"
          for MODE in demand45 hard38; do
            for SH in none full; do
              .venv/bin/python -I -B "$R/parametric_min_hinge_template_scan.py" \
                --mode "$MODE" --t 2 --hinge-mode full --sh-mode "$SH" \
                --dictionary-json "$R/N29_CANONICAL_DICTIONARY.json" \
                --boundary-json "$B" --output "out/${MODE}_${SH}.json"
            done
          done
      - name: Test all 902 if hard38 full family survives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          if not json.load(open('out/hard38_full.json'))['success']:
              print('FULL_MIN_HINGE_HARD38_FAILED_SKIP_ALL902')
              raise SystemExit(0)
          R='project/research/general_n/2026-09-09-rx-hall-v1'
          subprocess.check_call(['.venv/bin/python','-I','-B',f'{R}/parametric_min_hinge_template_scan.py',
            '--mode','t2','--t','2','--hinge-mode','full','--sh-mode','full',
            '--dictionary-json',f'{R}/N29_CANONICAL_DICTIONARY.json',
            '--demands-json','inputs/demands.json','--rows','inputs/row_survivors.txt',
            '--output','out/all902_full.json'])
          PY
      - name: Summarize
        run: |
          python3 - <<'PY' > out/SUMMARY.json
          import glob,json
          R={}
          for p in sorted(glob.glob('out/*.json')):
              if p.endswith('SUMMARY.json'): continue
              j=json.load(open(p));R[p.split('/')[-1]]={k:j.get(k) for k in ['mode','t','profiles','hinge_mode','hinge_count','SH_mode','SH_count','success','status','objective','active_hinge_count','active_SH_count','seconds']}
              if j.get('success'):
                  R[p.split('/')[-1]]['active_hinges']=j.get('active_hinges',[])
                  R[p.split('/')[-1]]['active_SH']=j.get('active_SH',[])
          print(json.dumps({'schema':'n29-t2-full-min-hinge-batch-v1','floating_point_reconnaissance_only':True,'results':R},indent=2,sort_keys=True))
          PY
          cat out/SUMMARY.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-t2-full-min-hinge
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit durable summary
        if: always()
        run: |
          set -euo pipefail
          test -s out/SUMMARY.json || exit 0
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_T2_FULL_MIN_HINGE_RUN_${GITHUB_RUN_ID}.json"
          cp out/SUMMARY.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 t2 full min-hinge scan ${GITHUB_RUN_ID}" || exit 0
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            sleep $((attempt*2))
          done
          exit 1
