name: verify layered receiver capacity

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/LAYERED_RECEIVER_CAPACITY.md'
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/verify_layered_receiver_capacity.py'
      - '.github/workflows/verify-layered-receiver-capacity.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run independent finite verifier
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 verify_layered_receiver_capacity.py
      - name: Upload verification record
        uses: actions/upload-artifact@v4
        with:
          name: layered-receiver-capacity-verification
          path: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/LAYERED_RECEIVER_CAPACITY_VERIFICATION.json
