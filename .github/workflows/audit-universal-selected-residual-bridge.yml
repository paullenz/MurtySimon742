name: Audit universal selected-residual bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-11-universal-selected-residual-bridge-v1/**'
      - '.github/workflows/audit-universal-selected-residual-bridge.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run exact arithmetic audit
        run: |
          set -euo pipefail
          python3 project/research/general_n/2026-09-11-universal-selected-residual-bridge-v1/exact_arithmetic_audit.py
