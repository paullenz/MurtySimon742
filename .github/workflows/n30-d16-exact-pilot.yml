name: N30 Delta16 exact-certificate pilot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/n30-d16-exact-pilot.yml'

permissions:
  contents: read
  actions: read

jobs:
  exact-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {m: 226, shard: 0, shards: 100}
          - {m: 225, shard: 0, shards: 500}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: n30-d16-m${{ matrix.m }}-rows
          path: rows
          github-token: ${{ github.token }}
          run-id: 34286806474
      - name: Pin solver dependency
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Produce and exactly verify certificate pilot
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-08-minimal-kernel-recon-v1
          time .venv/bin/python -I -B "$D/n30_threshold_scan.py" \
            --demands rows/demands.txt --rows rows/row_survivors.txt \
            --m ${{ matrix.m }} --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} \
            --exact --output certificates.json.gz > report.json
          cat report.json
          python3 - <<'PY'
          import json
          r=json.load(open('report.json'))
          c=r['counts']
          assert c['numerical_other']==0
          assert c['exact_missing']==0
          assert c['exact_rejected']==c['rows_in_shard']
          print('all pilot rows exactly certified')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n30-d16-m${{ matrix.m }}-exact-pilot
          path: |
            report.json
            certificates.json.gz
          if-no-files-found: error
          retention-days: 30
