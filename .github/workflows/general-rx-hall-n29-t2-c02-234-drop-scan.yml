name: General RX-Hall n29 t2 c02 234 drop scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-c02-234-drop-scan.yml'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_t2_c02_234_drop_scan.py'

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        drop: ['r:3:2','r:3:4','r:3:5','r:4:2','r:3:12','r:4:6','r:4:3','r:2:14']
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 2 --output inputs
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 2 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Drop one generator
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          tag=$(echo '${{ matrix.drop }}' | tr ':' '-')
          .venv/bin/python -I -B "$R/n29_t2_c02_234_drop_scan.py" \
            --drop '${{ matrix.drop }}' --demands-json inputs/demands.json \
            --rows inputs/row_survivors.txt --output "out/drop-${tag}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-t2-c02-234-${{ matrix.drop }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
