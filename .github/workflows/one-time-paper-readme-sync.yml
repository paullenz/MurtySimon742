name: One-time standalone-paper README sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-paper-readme-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch reviewer surfaces
        run: python .github/scripts/one_time_paper_readme_sync.py
      - name: Commit reviewer surface update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CURRENT_STATE.md
          if ! git diff --cached --quiet; then
            git commit -m 'Highlight standalone paper programme in README'
            git push origin HEAD:main
          fi
