name: promote fully audited relational closures

on:
  push:
    paths:
      - '.github/workflows/promote-post-pair-relational-full.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-post-pair-relational-full
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download hash-pinned full discovery aggregate
        uses: actions/download-artifact@v4
        with:
          name: post-pair-relational-full-discovery-final
          path: /tmp/relational-discovery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34844403328

      - name: Download completed independent audit aggregate
        uses: actions/download-artifact@v4
        with:
          name: post-pair-relational-full-independent-audit-final
          path: /tmp/relational-audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34854911792

      - name: Execute separate reviewed-ledger promotion gate
        run: >-
          python3
          project/research/general_n/2026-09-13-alternative-attacks-v1/promote_post_pair_relational_full.py
          --discovery /tmp/relational-discovery
          --audit /tmp/relational-audit

      - name: Recheck canonical N34 ledger and syntax
        run: |
          python3 tools/check_n34_whole_state_ledger.py
          python3 -m py_compile \
            project/research/general_n/2026-09-13-alternative-attacks-v1/prepare_post_pair_targets.py \
            project/research/general_n/2026-09-13-alternative-attacks-v1/promote_post_pair_relational_full.py
          git diff --check

      - name: Require intended promotion delta
        run: |
          test "$(git status --porcelain | wc -l)" -ge 8
          git status --short
          grep -F "canonical exclusions:             4,626" CURRENT_STATE.md
          grep -F "canonical survivors:                952" CURRENT_STATE.md
          grep -F "whole-state closures:             3,632" CURRENT_STATE.md
          grep -F "4,626 exclusions / 952 survivors; 3,632 quantified whole-state closures" README.md
          grep -F '"promotion_status": "PROMOTED"' \
            project/research/general_n/2026-09-13-alternative-attacks-v1/POST_PAIR_RELATIONAL_FULL_PROMOTION_AUDIT.json

      - name: Commit reviewed promotion atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            CURRENT_STATE.md \
            RESEARCH_EVIDENCE_INDEX.md \
            project/research/general_n/2026-09-13-alternative-attacks-v1/WHOLE_STATE_LEDGER.tsv \
            project/research/general_n/2026-09-13-alternative-attacks-v1/WHOLE_STATE_LEDGER_N35.tsv \
            project/research/general_n/2026-09-13-alternative-attacks-v1/POST_PAIR_RELATIONAL_FULL_FRONTIER.md \
            project/research/general_n/2026-09-13-alternative-attacks-v1/POST_PAIR_RELATIONAL_FULL_PROMOTION_AUDIT.md \
            project/research/general_n/2026-09-13-alternative-attacks-v1/POST_PAIR_RELATIONAL_FULL_PROMOTION_AUDIT.json
          git diff --cached --check
          git commit -m "Promote independently audited 2,655 relational closures"
          git push origin HEAD:main
