name: Fan-free n30 Delta16 m227-230 trusted kernel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fan-free-n30-d16-m227-230.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        m: [227,228,229,230]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pin solver dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Prepare complete demand frontier and residual rows
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-08-minimal-kernel-recon-v1
          mkdir -p out
          .venv/bin/python -I -B "$D/n30_prepare.py" --m ${{ matrix.m }} --output out > out/prepare_stdout.json
          g++ -O3 -std=c++17 "$D/n30_rows.cpp" -o n30_rows
          ./n30_rows out/demands.txt out/row_survivors.txt out/row_bands.txt > out/ROWS_REPORT.json
          cat out/PREPARE_REPORT.json
          cat out/ROWS_REPORT.json
      - name: Apply exact row-threshold theorem
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-08-minimal-kernel-recon-v1
          python3 -I -B "$D/n30_row_threshold.py" --demands out/demands.txt --rows out/row_survivors.txt --m ${{ matrix.m }} --output out/threshold_survivors.txt > out/ROW_THRESHOLD_REPORT.json
          cat out/ROW_THRESHOLD_REPORT.json
      - name: Exactly reject every final row
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-08-minimal-kernel-recon-v1
          if [ -s out/threshold_survivors.txt ]; then
            .venv/bin/python -I -B "$D/n30_threshold_scan.py" --demands out/demands.txt --rows out/threshold_survivors.txt --m ${{ matrix.m }} --exact --output out/certificates.json.gz > out/FINAL_EXACT_REPORT.json
            python3 - <<'PY'
          import json
          r=json.load(open('out/FINAL_EXACT_REPORT.json'))
          c=r['counts']
          assert c['numerical_other']==0 and c['exact_missing']==0
          assert c['exact_rejected']==c['rows_in_shard']
          assert not r['survivors']
          PY
          else
            printf '{"counts":{"rows_in_shard":0,"exact_rejected":0},"survivors":[],"note":"row-threshold stage already closed scope"}\n' > out/FINAL_EXACT_REPORT.json
          fi
          cat out/FINAL_EXACT_REPORT.json
      - name: Build scope receipt
        run: |
          python3 - <<'PY'
          import json,pathlib
          m=${{ matrix.m }}
          p=json.load(open('out/PREPARE_REPORT.json')); r=json.load(open('out/ROWS_REPORT.json')); th=json.load(open('out/ROW_THRESHOLD_REPORT.json')); f=json.load(open('out/FINAL_EXACT_REPORT.json'))
          out={'schema':'fan-free-n30-d16-upper-scope-v1','n':30,'Delta':16,'m':m,'t':m-224,
               'prepare':p,'rows':r,'threshold':th,'final':f,'final_survivors':0,
               'status':'candidate fixed-order proof component; independent review open'}
          pathlib.Path(f'FAN_FREE_N30_D16_M{m}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fan-free-n30-d16-m${{ matrix.m }}
          path: |
            FAN_FREE_N30_D16_M${{ matrix.m }}.json
            out/PREPARE_REPORT.json
            out/ROWS_REPORT.json
            out/ROW_THRESHOLD_REPORT.json
            out/FINAL_EXACT_REPORT.json
            out/threshold_survivors.txt
            out/certificates.json.gz
          if-no-files-found: warn
          retention-days: 30
      - name: Commit durable receipt
        run: |
          set -euo pipefail
          cp FAN_FREE_N30_D16_M${{ matrix.m }}.json project/research/fan-free-fixed-orders/2026-09-09-v1/checkpoints_N30_D16_M${{ matrix.m }}.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/research/fan-free-fixed-orders/2026-09-09-v1/checkpoints_N30_D16_M${{ matrix.m }}.json
          git commit -m "Preserve Fan-free n30 Delta16 m${{ matrix.m }} closure ${GITHUB_RUN_ID}" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            git add project/research/fan-free-fixed-orders/2026-09-09-v1/checkpoints_N30_D16_M${{ matrix.m }}.json || true
            git commit -m "Preserve Fan-free n30 Delta16 m${{ matrix.m }} closure ${GITHUB_RUN_ID}" || true
            sleep $((attempt*2))
          done
          exit 1
