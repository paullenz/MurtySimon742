name: Fan-free n30 Delta16 m227-230 trusted kernel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fan-free-n30-d16-m227-230.yml'
      - 'project/research/fan-free-fixed-orders/2026-09-09-v1/n30_upper_prepare.py'
      - 'project/research/fan-free-fixed-orders/2026-09-09-v1/n30_upper_close.py'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        m: [227,228,229,230]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pin solver dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Prepare complete demand frontier and residual rows
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-08-minimal-kernel-recon-v1
          F=project/research/fan-free-fixed-orders/2026-09-09-v1
          mkdir -p out
          .venv/bin/python -I -B "$F/n30_upper_prepare.py" --m ${{ matrix.m }} --output out
          g++ -O3 -std=c++17 "$D/n30_rows.cpp" -o n30_rows
          ./n30_rows out/demands.txt out/row_survivors.txt out/row_bands.txt > out/ROWS_REPORT.json
          cat out/PREPARE_REPORT.json
          cat out/ROWS_REPORT.json
      - name: Apply exact row-threshold and Farkas closure
        run: |
          F=project/research/fan-free-fixed-orders/2026-09-09-v1
          .venv/bin/python -I -B "$F/n30_upper_close.py" --m ${{ matrix.m }} --demands out/demands.txt --rows out/row_survivors.txt --output out/CERTIFICATES.json.gz | tee out/CLOSE_REPORT.json
      - name: Build scope receipt
        run: |
          python3 - <<'PY'
          import json,pathlib
          m=${{ matrix.m }}
          p=json.load(open('out/PREPARE_REPORT.json')); r=json.load(open('out/ROWS_REPORT.json')); c=json.load(open('out/CLOSE_REPORT.json'))
          out={'schema':'fan-free-n30-d16-upper-scope-v1','n':30,'Delta':16,'m':m,'t':m-224,'prepare':p,'rows':r,'close':c,'final_survivors':0,'status':'candidate fixed-order proof component; independent review open'}
          pathlib.Path(f'FAN_FREE_N30_D16_M{m}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fan-free-n30-d16-m${{ matrix.m }}
          path: |
            FAN_FREE_N30_D16_M${{ matrix.m }}.json
            out/PREPARE_REPORT.json
            out/ROWS_REPORT.json
            out/CLOSE_REPORT.json
            out/CERTIFICATES.json.gz
          retention-days: 30
      - name: Commit durable receipt
        run: |
          set -euo pipefail
          cp FAN_FREE_N30_D16_M${{ matrix.m }}.json project/research/fan-free-fixed-orders/2026-09-09-v1/checkpoints_N30_D16_M${{ matrix.m }}.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/research/fan-free-fixed-orders/2026-09-09-v1/checkpoints_N30_D16_M${{ matrix.m }}.json
          git commit -m "Preserve Fan-free n30 Delta16 m${{ matrix.m }} closure ${GITHUB_RUN_ID}" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            git add project/research/fan-free-fixed-orders/2026-09-09-v1/checkpoints_N30_D16_M${{ matrix.m }}.json || true
            git commit -m "Preserve Fan-free n30 Delta16 m${{ matrix.m }} closure ${GITHUB_RUN_ID}" || true
            sleep $((attempt*2))
          done
          exit 1
