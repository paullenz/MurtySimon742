name: scan q-stratified receiver Hall reach pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/make_q_crossing_stats_scanner.py'
      - '.github/workflows/scan-q-stratified-receiver-reach-pilot.yml'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare same deterministic 1/256 pilot shard
        working-directory: project/research/general_n/2026-09-13-alternative-attacks-v1
        run: python3 prepare_pair_capacity_frontier.py --mod 256 --rem 16 --output Q_STRATIFIED_RECEIVER_REACH_PILOT_INPUT.txt

      - name: Generate canonical antichain scanner
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 make_antichain_stats_scanner.py

      - name: Add coarse-band instrumentation
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 make_band_reach_scanner.py

      - name: Add compatible-copy instrumentation
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 make_compatible_copy_band_reach_scanner.py

      - name: Add layered-receiver instrumentation
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 make_layered_receiver_reach_scanner.py

      - name: Add exact q-crossing statistic instrumentation
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: python3 make_q_crossing_stats_scanner.py

      - name: Compile scanner
        working-directory: project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1
        run: g++ -O3 -std=c++17 -Wall -Wextra -pedantic scan_q_crossing_stats.cpp -o scan_q_crossing_stats

      - name: Run pilot
        run: |
          project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/scan_q_crossing_stats \
            project/research/general_n/2026-09-13-alternative-attacks-v1/Q_STRATIFIED_RECEIVER_REACH_PILOT_INPUT.txt \
            Q_STRATIFIED_RECEIVER_REACH_PILOT.tsv \
            2>&1 | tee Q_STRATIFIED_RECEIVER_REACH_PILOT_REPLAY.txt

      - name: Summarize and assert baseline reproduction
        run: |
          python3 - <<'PY'
          import csv,json
          rows=list(csv.DictReader(open('Q_STRATIFIED_RECEIVER_REACH_PILOT.tsv'),delimiter='\t'))
          target=sum(int(r['targethall_fail']) for r in rows)
          band=sum(int(r['band_fail']) for r in rows)
          cc=sum(int(r['ccband_fail']) for r in rows)
          lf=sum(int(r['layer_fail']) for r in rows)
          lp=sum(int(r['layer_pass']) for r in rows)
          qf=sum(int(r['qlayer_fail']) for r in rows)
          qp=sum(int(r['qlayer_pass']) for r in rows)
          qzero=sum(int(r['qcross_zero']) for r in rows)
          qpos=sum(int(r['qcross_positive']) for r in rows)
          if target!=205919 or band!=205918 or cc!=205919 or lf!=205107 or lp!=812:
              raise SystemExit(f'baseline changed target={target} band={band} cc={cc} layer={lf}+{lp}')
          if qf+qp!=target or qzero+qpos!=target:
              raise SystemExit(f'q accounting mismatch qlayer={qf}+{qp} crossing={qzero}+{qpos} target={target}')
          hist={str(i):sum(int(r[f'qcross_{i}']) for r in rows) for i in range(9)}
          hist['9+']=sum(int(r['qcross_9plus']) for r in rows)
          summary={
            'schema':'q-stratified-receiver-reach-pilot-v3-crossing-statistic',
            'states':len(rows),
            'profiles_tested':sum(int(r['profiles_tested']) for r in rows),
            'target_hall_failure_profiles':target,
            'global_layer_detected':lf,
            'global_layer_false_negatives':lp,
            'q_stratified_detected':qf,
            'q_stratified_false_negatives':qp,
            'zero_crossing_profiles':qzero,
            'positive_crossing_profiles':qpos,
            'crossing_sum':sum(int(r['qcross_sum']) for r in rows),
            'maximum_crossing':max(int(r['qcross_max']) for r in rows),
            'crossing_histogram':hist,
            'promotion_status':'RECONNAISSANCE_ONLY',
            'external_review':'OPEN'
          }
          open('Q_STRATIFIED_RECEIVER_REACH_PILOT_SUMMARY.json','w').write(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: q-stratified-receiver-reach-pilot
          path: |
            project/research/general_n/2026-09-13-alternative-attacks-v1/Q_STRATIFIED_RECEIVER_REACH_PILOT_INPUT.txt
            project/research/general_n/2026-09-13-alternative-attacks-v1/Q_STRATIFIED_RECEIVER_REACH_PILOT_INPUT_VERIFICATION.json
            project/research/general_n/2026-09-14-type-compressed-orientation-hall-v1/scan_q_crossing_stats.cpp
            Q_STRATIFIED_RECEIVER_REACH_PILOT.tsv
            Q_STRATIFIED_RECEIVER_REACH_PILOT_REPLAY.txt
            Q_STRATIFIED_RECEIVER_REACH_PILOT_SUMMARY.json
