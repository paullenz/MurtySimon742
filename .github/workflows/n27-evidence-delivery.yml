name: Assemble frozen N27 evidence for delivery

on:
  push:
    branches:
      - delivery/n27-evidence-zip-2026-09-07

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve pinned parts and verify the exact frozen archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          REPO = 'paullenz/MurtySimon25'
          REF = '15632e01f6dbcaa4055e138e03fc3ecee68540f1'
          NAME = 'N27_Candidate_Evidence_2026-09-07_v1.zip'
          EXPECTED_SIZE = 71778093
          EXPECTED_SHA256 = '8381ed450859b9efa54fa6ec3c76bda786ec3fc31ec52732637c5346224caf3c'
          API = 'https://api.github.com/repos/' + REPO
          DIRECTORY = 'releases/n27-candidate-v1'

          def get(url, raw=False):
              if not url.startswith(API + '/'):
                  raise ValueError('Only this repository is an allowed source')
              headers = {
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github.raw+json' if raw else 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'n27-frozen-evidence-delivery',
              }
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read()

          entries = json.loads(get(API + '/contents/' + DIRECTORY + '?ref=' + REF))
          parts = sorted((e for e in entries if e['name'].startswith(NAME + '.part')), key=lambda e: e['name'])
          expected_names = [NAME + '.part%02d' % i for i in range(1, 10)]
          if [e['name'] for e in parts] != expected_names:
              raise ValueError('Incomplete or unexpected archive part sequence')

          out = Path('deliver')
          out.mkdir()
          archive = out / NAME
          part_checks = []
          with archive.open('wb') as target:
              for entry in parts:
                  url = API + '/contents/' + DIRECTORY + '/' + entry['name'] + '?ref=' + REF
                  data = get(url, raw=True)
                  if len(data) != entry['size']:
                      raise ValueError('Part byte length mismatch: ' + entry['name'])
                  git_hash = hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest()
                  if git_hash != entry['sha']:
                      raise ValueError('Part Git hash mismatch: ' + entry['name'])
                  target.write(data)
                  part_checks.append({'name': entry['name'], 'bytes': len(data), 'git_sha1': git_hash, 'sha256': hashlib.sha256(data).hexdigest()})
                  print('Verified', entry['name'], len(data), 'bytes', flush=True)

          sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          if archive.stat().st_size != EXPECTED_SIZE or sha256 != EXPECTED_SHA256:
              raise ValueError('Frozen archive size or SHA-256 mismatch')
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              if len(names) != 116:
                  raise ValueError('Unexpected ZIP entry count')
              for required in ('PROOF.md', 'README.md', 'replay.py', 'MANIFEST.json'):
                  if not any(n.endswith('/' + required) for n in names):
                      raise ValueError('Missing required payload: ' + required)
              expanded_size = sum(i.file_size for i in z.infolist())

          check = {
              'status': 'PASS',
              'scope': 'Archive assembly and integrity only; not a new mathematical or computational proof replay',
              'evidence_commit': REF,
              'archive': NAME,
              'archive_bytes': archive.stat().st_size,
              'archive_sha256': sha256,
              'zip_entries': len(names),
              'expanded_bytes': expanded_size,
              'parts': part_checks,
              'frozen_evidence_modified': False,
              'independent_mathematical_review': 'OPEN',
              'independent_computational_reproduction': 'OPEN',
          }
          (out / 'DELIVERY_CHECK.json').write_text(json.dumps(check, indent=2) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS').write_text(sha256 + '  ' + NAME + '\n', encoding='ascii')
          print('PASS:', NAME, EXPECTED_SIZE, 'bytes; SHA-256', sha256, flush=True)
          PY
      - name: Make the verified archive downloadable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N27_Frozen_Evidence_2026-09-07_v1
          path: deliver/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
