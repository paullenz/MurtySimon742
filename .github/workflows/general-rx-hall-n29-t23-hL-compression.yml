name: General RX-Hall n29 t2-t3 h-L compression scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t23-hL-compression.yml'
      - 'project/research/general_n/2026-09-11-regime-structure-v1/n29_t23_hL_compression_scan.py'
      - 'project/reviews/n29/2026-09-08-redteam-restart-v1/minimal_prepare.py'
      - 'project/reviews/n29/2026-09-08-redteam-restart-v1/minimal_rows.cpp'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Build audited residual-row scanner
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
      - name: Regenerate t2 and t3 frontiers
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs/t2 inputs/t3 out
          for t in 2 3; do
            .venv/bin/python -I -B "$D/minimal_prepare.py" --t "$t" --output "inputs/t$t"
            ./minimal_rows "inputs/t$t/demands.txt" "inputs/t$t/row_survivors.txt" "inputs/t$t/row_bands.txt" "$t" > "inputs/t$t/MINIMAL_ROWS_REPORT.json"
          done
      - name: Replay h-L collision and weighted-unit repair
        run: |
          set -euo pipefail
          N=project/research/general_n/2026-09-11-regime-structure-v1
          /usr/bin/python3 -I -B "$N/n29_t23_hL_compression_scan.py" \
            --t2-demands-json inputs/t2/demands.json \
            --t2-rows inputs/t2/row_survivors.txt \
            --t3-demands-json inputs/t3/demands.json \
            --t3-rows inputs/t3/row_survivors.txt \
            --output out/N29_T23_HL_COMPRESSION_SCAN.json
          cp inputs/t2/MINIMAL_ROWS_REPORT.json out/T2_MINIMAL_ROWS_REPORT.json
          cp inputs/t3/MINIMAL_ROWS_REPORT.json out/T3_MINIMAL_ROWS_REPORT.json
          sha256sum out/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-t23-hL-compression
          path: out/*
          if-no-files-found: error
          retention-days: 30
