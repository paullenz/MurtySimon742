name: General RX-Hall n29 t3 fixed integer 6 4 3 exact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t3-fixed-integer-643-exact.yml'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_t3_fixed_integer_643_exact.py'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_common_potential_verify_generic.py'

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t3 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 3 --output inputs
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 3 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Exactify fixed integer potential
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/n29_t3_fixed_integer_643_exact.py" \
            --demands-json inputs/demands.json --rows inputs/row_survivors.txt \
            --output out/exact-t3-fixed-643.json
      - name: Independent standard-library replay
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          python3 -I -B "$R/n29_common_potential_verify_generic.py" --t 3 \
            --demands-json inputs/demands.json --rows inputs/row_survivors.txt \
            --exact-json out/exact-t3-fixed-643.json --output out/replay-t3-fixed-643.json
          sha256sum out/exact-t3-fixed-643.json out/replay-t3-fixed-643.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-t3-fixed-integer-643-exact
          path: out/*
          if-no-files-found: error
          retention-days: 30
