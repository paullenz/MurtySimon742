name: Sync analytic hinge frontier READMEs

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/sync_hinge_frontier_readmes.py'
      - '.github/workflows/sync-analytic-hinge-frontier-readmes.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Patch READMEs deterministically
        run: python3 project/research/general_n/2026-09-09-rx-hall-v1/sync_hinge_frontier_readmes.py
      - name: Commit synchronized frontier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add README.md project/research/general_n/2026-09-09-rx-hall-v1/README.md
          git commit -m 'Sync READMEs to exact analytic hinge frontier' || exit 0
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD
            git pull --rebase origin main
            sleep $((attempt*2))
          done
          exit 1
