name: General RX-Hall n30 RX4-core

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/rx_hall_rx4_core_exact.py'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/rx_hall_exact.py'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/rx_hall_scan.py'
      - 'project/research/n30/2026-09-08-minimal-kernel-recon-v1/n30_prepare.py'
      - 'project/research/n30/2026-09-08-minimal-kernel-recon-v1/n30_rows.cpp'
      - 'project/research/n30/2026-09-08-minimal-kernel-recon-v1/n30_row_threshold.py'
      - '.github/workflows/general-rx-hall-n30-rx4-core.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {m: 226, t: 2, demands: 2590, raw: 35530, threshold: 9, hard: 8}
          - {m: 225, t: 1, demands: 5379, raw: 150896, threshold: 272, hard: 207}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate exact threshold frontier
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-08-minimal-kernel-recon-v1
          mkdir -p inputs
          .venv/bin/python -I -B "$D/n30_prepare.py" --m ${{ matrix.m }} --output inputs
          g++ -O3 -std=c++17 "$D/n30_rows.cpp" -o n30_rows
          ./n30_rows inputs/demands.txt inputs/raw_rows.txt inputs/bands.txt > inputs/ROWS.json
          .venv/bin/python -I -B "$D/n30_row_threshold.py" --demands inputs/demands.txt --rows inputs/raw_rows.txt --output inputs/rows.txt --m ${{ matrix.m }} > inputs/THRESHOLD.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          z=Path('inputs/demands.txt').read_text().splitlines(); n=int(z[0]); D=[]
          for line in z[1:]: D.append({'s':list(map(int,line.split()))[:13]})
          assert n==len(D)==${{ matrix.demands }}
          assert json.load(open('inputs/ROWS.json'))['survivors']==${{ matrix.raw }}
          assert json.load(open('inputs/THRESHOLD.json'))['counts']['survivors']==${{ matrix.threshold }}
          Path('inputs/demands.json').write_text(json.dumps(D,separators=(',',':'))+'\n')
          PY
      - name: Run exact RX4 Hall core
        id: rx4
        continue-on-error: true
        run: |
          D=project/research/general_n/2026-09-09-rx-hall-v1
          mkdir -p out
          .venv/bin/python -I -B "$D/rx_hall_rx4_core_exact.py" --demands-json inputs/demands.json --rows inputs/rows.txt --a 13 --b 16 --dmax 11 --t ${{ matrix.t }} --output out/certificates.json.gz
      - name: Classify and preserve
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('out/certificates.json.gz.report.json'); assert p.exists()
          r=json.load(open(p)); assert r['hard_rows']==${{ matrix.hard }}
          o={'schema':'n30-rx4-hall-core-falsification-v3','m':${{ matrix.m }},'t':${{ matrix.t }},'hard_rows':r['hard_rows'],'exact_integer_farkas_rejections':r['exact_integer_farkas_rejections'],'unresolved_count':len(r['unresolved']),'unresolved':r['unresolved'],'status':'PASS_ALL_REJECTED' if not r['unresolved'] else 'SURVIVORS','uses_rx4':True,'removes_R_P_Z':True,'two_rectangle_hall_only':True}
          pathlib.Path('out/CLASSIFICATION.json').write_text(json.dumps(o,indent=2,sort_keys=True)+'\n'); print(json.dumps(o,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n30-rx4-core-m${{ matrix.m }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Require zero survivors
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('out/CLASSIFICATION.json')); assert r['unresolved_count']==0,r
          PY

  checkpoint:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'n30-rx4-core-m*'
          path: reports
      - name: Consolidate durable checkpoint
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json,pathlib
          docs=[]
          for p in pathlib.Path('reports').rglob('CLASSIFICATION.json'):
              docs.append(json.load(open(p)))
          docs=sorted(docs,key=lambda d:d['m'],reverse=True)
          assert [d['m'] for d in docs]==[226,225],docs
          out={'schema':'n30-rx4-hall-core-checkpoint-v2','run_id':'${{ github.run_id }}','status':'COMPLETE_REJECTION' if all(d['unresolved_count']==0 for d in docs) else 'SURVIVORS_PRESERVED','results':docs,'interpretation':'Necessary-condition Hall core only; survivors are relaxation states, not graphs. Existing n30 proof is unaffected.'}
          pathlib.Path('out/checkpoint.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Publish unique checkpoint through contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          P="project/research/general_n/2026-09-09-rx-hall-v1/checkpoints/N30_RX4_CORE_RUN_${GITHUB_RUN_ID}.json"
          C=$(base64 -w0 out/checkpoint.json)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${P}" -f message="Preserve n30 RX4 Hall-core run ${GITHUB_RUN_ID}" -f content="$C" -f branch=main
