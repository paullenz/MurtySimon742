name: General RX-Hall adjacent regime-key red-team

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-adjacent-regime-key-redteam.yml'
      - 'project/research/general_n/2026-09-11-regime-structure-v1/adjacent_t123_regime_key_redteam.py'
      - 'project/research/general_n/2026-09-11-regime-structure-v1/adjacent_t123_validity_mask_audit_exact.py'
      - 'project/research/general_n/2026-09-11-regime-structure-v1/n29_t3_template_mask_structure_exact.py'
      - 'project/research/general_n/2026-09-11-regime-structure-v1/n29_t3_hJ_collision_exact.py'
      - 'project/research/general_n/2026-09-11-regime-structure-v1/n29_t3_joint_capacity_structure_exact.py'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_t3_four_scalar_templates_exact.py'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_t2_sh3_c11_three_scalar_exact.py'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n30_t1_two_rational_templates_exact.py'
      - 'project/reviews/n29/2026-09-08-redteam-restart-v1/minimal_prepare.py'
      - 'project/reviews/n29/2026-09-08-redteam-restart-v1/minimal_rows.cpp'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Build audited residual-row scanner
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
      - name: Regenerate t2 and t3 exact frontiers
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs/t2 inputs/t3 out
          for t in 2 3; do
            .venv/bin/python -I -B "$D/minimal_prepare.py" --t "$t" --output "inputs/t$t"
            ./minimal_rows "inputs/t$t/demands.txt" "inputs/t$t/row_survivors.txt" "inputs/t$t/row_bands.txt" "$t" > "inputs/t$t/MINIMAL_ROWS_REPORT.json"
          done
      - name: Run assignment audit and independent exact structure scans
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          N=project/research/general_n/2026-09-11-regime-structure-v1
          /usr/bin/python3 -I -B "$N/adjacent_t123_regime_key_redteam.py" \
            --t1-exact-script "$R/n30_t1_two_rational_templates_exact.py" \
            --t2-demands-json inputs/t2/demands.json \
            --t2-rows inputs/t2/row_survivors.txt \
            --t3-demands-json inputs/t3/demands.json \
            --t3-rows inputs/t3/row_survivors.txt \
            --output out/ADJACENT_T123_REGIME_KEY_REDTEAM.json
          /usr/bin/python3 -I -B "$N/adjacent_t123_validity_mask_audit_exact.py" \
            --t1-script "$R/n30_t1_two_rational_templates_exact.py" \
            --t2-script "$R/n29_t2_sh3_c11_three_scalar_exact.py" \
            --t3-script "$R/n29_t3_four_scalar_templates_exact.py" \
            --t2-demands-json inputs/t2/demands.json \
            --t2-rows inputs/t2/row_survivors.txt \
            --t3-demands-json inputs/t3/demands.json \
            --t3-rows inputs/t3/row_survivors.txt \
            --output out/ADJACENT_T123_VALIDITY_MASK_AUDIT_EXACT.json
          /usr/bin/python3 -I -B "$N/n29_t3_template_mask_structure_exact.py" \
            --cover-script "$R/n29_t3_four_scalar_templates_exact.py" \
            --demands-json inputs/t3/demands.json \
            --rows inputs/t3/row_survivors.txt \
            --output out/N29_T3_TEMPLATE_MASK_STRUCTURE_EXACT.json
          /usr/bin/python3 -I -B "$N/n29_t3_hJ_collision_exact.py" \
            --cover-script "$R/n29_t3_four_scalar_templates_exact.py" \
            --demands-json inputs/t3/demands.json \
            --rows inputs/t3/row_survivors.txt \
            --output out/N29_T3_HJ_COLLISION_EXACT.json
          /usr/bin/python3 -I -B "$N/n29_t3_joint_capacity_structure_exact.py" \
            --cover-script "$R/n29_t3_four_scalar_templates_exact.py" \
            --demands-json inputs/t3/demands.json \
            --rows inputs/t3/row_survivors.txt \
            --output out/N29_T3_JOINT_CAPACITY_STRUCTURE_EXACT.json
          cp inputs/t2/MINIMAL_ROWS_REPORT.json out/T2_MINIMAL_ROWS_REPORT.json
          cp inputs/t3/MINIMAL_ROWS_REPORT.json out/T3_MINIMAL_ROWS_REPORT.json
          sha256sum out/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adjacent-t123-regime-key-redteam
          path: out/*
          if-no-files-found: error
          retention-days: 30
