name: Audit N29 late-LP embedding

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/reviews/n29/2026-09-11-late-lp-embedding-audit-v1/**'
      - 'project/reviews/n29/2026-09-08-redteam-restart-v1/independent_threshold_model_v2.py'
      - 'project/reviews/n29/2026-09-08-redteam-restart-v1/independent_threshold_model.py'
      - '.github/workflows/audit-n29-late-lp-embedding.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact audit dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0

      - name: Run exact microstate embedding regression
        run: python project/reviews/n29/2026-09-11-late-lp-embedding-audit-v1/microstate_embedding_audit.py

      - name: Validate audit receipt
        run: |
          python - <<'PY'
          import json
          p='project/reviews/n29/2026-09-11-late-lp-embedding-audit-v1/MICROSTATE_AUDIT_REPORT.json'
          r=json.load(open(p))
          assert r['status']=='PASS'
          assert r['corrected_v2_all_rows_satisfied'] is True
          assert r['historical_v1_detectably_fails'] is True
          assert len(r['fixtures'])==2
          for f in r['fixtures']:
              assert f['corrected_v2']['violations']==0
              assert f['quarantined_v1_failures']['total']>0
          print(json.dumps(r,indent=2))
          PY

      - name: Commit audit receipt
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/reviews/n29/2026-09-11-late-lp-embedding-audit-v1/MICROSTATE_AUDIT_REPORT.json
          if git diff --cached --quiet; then
            echo 'Audit receipt already current.'
            exit 0
          fi
          git commit -m 'Record N29 late-LP embedding audit receipt'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo 'Unable to publish audit receipt after retries' >&2
          exit 1
