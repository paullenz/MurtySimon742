name: N30 Delta16 corrected-threshold pilot

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/n30/2026-09-08-minimal-kernel-recon-v1/n30_threshold_model.py'
      - 'project/research/n30/2026-09-08-minimal-kernel-recon-v1/n30_threshold_scan.py'
      - '.github/workflows/n30-d16-threshold-pilot.yml'

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        m: [225,226]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: n30-d16-m${{ matrix.m }}-rows
          path: rows
          github-token: ${{ github.token }}
          run-id: 34286806474
      - name: Pin solver dependency
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Run deterministic one-percent pilot
        run: |
          set -euo pipefail
          D=project/research/n30/2026-09-08-minimal-kernel-recon-v1
          time .venv/bin/python -I -B "$D/n30_threshold_scan.py" \
            --demands rows/demands.txt --rows rows/row_survivors.txt \
            --m ${{ matrix.m }} --shard 0 --shards 100 > pilot.json
          cat pilot.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n30-d16-m${{ matrix.m }}-threshold-pilot
          path: pilot.json
          if-no-files-found: error
          retention-days: 30
