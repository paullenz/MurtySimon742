name: Check layer-sum construction bridge
on:
  push:
    branches: [main]
    paths:
      - 'project/research/general_n/2026-09-08-layer-sum-v1/src/check_construction_independent.py'
      - 'project/research/general_n/2026-09-08-layer-sum-v1/src/check_residual_injection_independent.py'
      - 'project/research/general_n/2026-09-08-layer-sum-v1/src/check_threshold_adversarial.py'
      - 'project/research/general_n/2026-09-08-layer-sum-v1/src/check_layer_aggregation_adversarial.py'
      - 'project/research/general_n/2026-09-08-layer-sum-v1/src/check_surplus_degree_adversarial.py'
      - '.github/workflows/layer-sum-construction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run independent construction census
        run: |
          set -euo pipefail
          python3 --version | tee python-version.txt
          F=project/research/general_n/2026-09-08-layer-sum-v1/src/check_construction_independent.py
          sha256sum "$F" | tee checked-source-sha256.txt
          python3 -I -B "$F" | tee construction-check.json
          grep -F '"status": "PASS"' construction-check.json
          grep -F '"missing_B_pairs": 720' construction-check.json
          grep -F '1f2b1bb5bd91d54937f166abd0c26badd8ddd105441cd37a6d0150c557d46c5e' construction-check.json
      - name: Run independent residual-injection audit
        run: |
          set -euo pipefail
          F=project/research/general_n/2026-09-08-layer-sum-v1/src/check_residual_injection_independent.py
          sha256sum "$F" | tee residual-source-sha256.txt
          python3 -I -B "$F" | tee residual-injection-check.json
          grep -F '"status": "PASS"' residual-injection-check.json
          grep -F '"sample_forced_targets": 588' residual-injection-check.json
          grep -F '"sample_nonzero_forced_systems": 163' residual-injection-check.json
          grep -F '5e33b3ad7d7fc8d1276ebab7de09dc03026346779d41e1a4411032dd9acc069a' residual-injection-check.json
      - name: Run adversarial threshold-capacity audit
        run: |
          set -euo pipefail
          F=project/research/general_n/2026-09-08-layer-sum-v1/src/check_threshold_adversarial.py
          sha256sum "$F" | tee threshold-source-sha256.txt
          python3 -I -B "$F" | tee threshold-adversarial-check.json
          grep -F '"status": "PASS"' threshold-adversarial-check.json
          grep -F '"minimum_bound_gap": 0' threshold-adversarial-check.json
          grep -F '"opposite_orientations": "violate as expected"' threshold-adversarial-check.json
          grep -F '"high_source_outside_Z": "violate as expected"' threshold-adversarial-check.json
      - name: Run adversarial layer-aggregation audit
        run: |
          set -euo pipefail
          F=project/research/general_n/2026-09-08-layer-sum-v1/src/check_layer_aggregation_adversarial.py
          sha256sum "$F" | tee aggregation-source-sha256.txt
          python3 -I -B "$F" | tee layer-aggregation-check.json
          grep -F '"status": "PASS"' layer-aggregation-check.json
          grep -F '"complete_sorted_demand_profiles": 478192' layer-aggregation-check.json
          grep -F '"nonzero_profiles": 478181' layer-aggregation-check.json
          grep -F '"threshold_levels_checked": 4215632' layer-aggregation-check.json
          grep -F '"worst_rhs_over_lhs": "13301/11000"' layer-aggregation-check.json
      - name: Run scalar surplus and degree-assembly audit
        run: |
          set -euo pipefail
          F=project/research/general_n/2026-09-08-layer-sum-v1/src/check_surplus_degree_adversarial.py
          sha256sum "$F" | tee surplus-source-sha256.txt
          python3 -I -B "$F" | tee surplus-degree-check.json
          grep -F '"status": "PASS"' surplus-degree-check.json
          grep -F '"scalar_cases": 2666600' surplus-degree-check.json
          grep -F '"degree_cases": 5107274' surplus-degree-check.json
          grep -F '"minimum_scaled_strict_margin": 17' surplus-degree-check.json
          grep -F '"ratio": "t/a^2=4/81"' surplus-degree-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layer-sum-construction-check
          path: |
            construction-check.json
            residual-injection-check.json
            threshold-adversarial-check.json
            layer-aggregation-check.json
            surplus-degree-check.json
            python-version.txt
            checked-source-sha256.txt
            residual-source-sha256.txt
            threshold-source-sha256.txt
            aggregation-source-sha256.txt
            surplus-source-sha256.txt
          if-no-files-found: error
          retention-days: 7
