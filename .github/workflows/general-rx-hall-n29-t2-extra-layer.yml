name: General RX-Hall n29 t2 one extra layer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/general-rx-hall-n29-t2-extra-layer.yml'
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_t2_extra_layer_scan.py'

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        extraD: [0, 1, 4, 5, 6, 7, 8, 9, 10, 11]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Regenerate n29 t2 frontier
        run: |
          set -euo pipefail
          D=project/reviews/n29/2026-09-08-redteam-restart-v1
          mkdir -p inputs out
          g++ -O3 -std=c++17 "$D/minimal_rows.cpp" -o minimal_rows
          .venv/bin/python -I -B "$D/minimal_prepare.py" --t 2 --output inputs
          ./minimal_rows inputs/demands.txt inputs/row_survivors.txt inputs/row_bands.txt 2 > inputs/MINIMAL_ROWS_REPORT.json
      - name: Test extra D=${{ matrix.extraD }}
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          .venv/bin/python -I -B "$R/n29_t2_extra_layer_scan.py" \
            --extra-D '${{ matrix.extraD }}' --demands-json inputs/demands.json \
            --rows inputs/row_survivors.txt --output 'out/D${{ matrix.extraD }}.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-t2-extra-layer-D${{ matrix.extraD }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 30
