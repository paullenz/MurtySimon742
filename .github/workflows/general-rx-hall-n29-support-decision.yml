name: General RX-Hall n29 common support decision

on:
  workflow_dispatch:
  push:
    paths:
      - 'project/research/general_n/2026-09-09-rx-hall-v1/n29_common_support_decision.py'
      - '.github/workflows/general-rx-hall-n29-support-decision.yml'

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        K: [12,13]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Pin solver
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: scipy==1.17.0
      - name: Decide support feasibility
        run: |
          set -euo pipefail
          R=project/research/general_n/2026-09-09-rx-hall-v1
          mkdir -p out
          .venv/bin/python -I -B "$R/n29_common_support_decision.py" \
            --boundary-json "$R/checkpoints/N29_BOUNDARY_SPECIALISATION_RUN_34364666552.json" \
            --support-json "$R/checkpoints/N30_SHARED_MIN_SUPPORT_RUN_34361230390.json" \
            --correction-json "$R/checkpoints/N29_PAIRWISE_CORRECTION_RUN_34365472773.json" \
            --a 12 --b 16 --dmax 10 --K ${{ matrix.K }} --big-m 200 --time-limit 300 \
            --output out/DECISION.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: n29-common-support-decision-K${{ matrix.K }}
          path: out/DECISION.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit durable checkpoint
        if: always()
        run: |
          set -euo pipefail
          test -s out/DECISION.json || exit 0
          R=project/research/general_n/2026-09-09-rx-hall-v1/checkpoints
          P="$R/N29_SUPPORT_DECISION_K${{ matrix.K }}_RUN_${GITHUB_RUN_ID}.json"
          cp out/DECISION.json "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m "Preserve n29 support decision K${{ matrix.K }} run ${GITHUB_RUN_ID}" || exit 0
          git restore . || true
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase --autostash origin main
            sleep $((attempt*2))
          done
          exit 1
