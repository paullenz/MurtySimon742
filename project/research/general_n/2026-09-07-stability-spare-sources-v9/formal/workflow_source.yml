name: Check v9 quasi-edge core in Lean
on:
  push:
    branches: [main]
    paths:
      - 'project/research/general_n/2026-09-07-stability-spare-sources-v9/formal/QuasiCore.lean'
      - '.github/workflows/v9-quasi-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install fixed official Lean 4.19.0 toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          sha256sum "$RUNNER_TEMP/lean.tar.zst" > lean-toolchain-sha256.txt
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Check only the explicitly scoped local-logic lemmas
        run: |
          set -euo pipefail
          F=project/research/general_n/2026-09-07-stability-spare-sources-v9/formal/QuasiCore.lean
          lean --version | tee lean-version.txt
          sha256sum "$F" > checked-source-sha256.txt
          lean "$F" 2>&1 | tee lean-check.log
          if grep -E 'sorryAx|warning:|error:' lean-check.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-quasi-core-check
          path: |
            lean-check.log
            lean-version.txt
            lean-toolchain-sha256.txt
            checked-source-sha256.txt
          if-no-files-found: error
          retention-days: 7
